name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Must match the target published by docker-bake.hcl
  # (`${REGISTRY}/amazonerp-gateway:${TAG}-${GIT_SHA}`), and the tag below must
  # match the TAG and GIT_SHA variables the bake step exports.
  IMAGE_NAME: amazonerp-gateway
  # Single source of truth for the release image list. Contract tests keep it
  # aligned with docker-bake.hcl; SBOM, scan, and signing loops all use it.
  RELEASE_IMAGES: "gateway ad ai customer finance logistics message multiplatform ops order procurement product report search spapi user frontend"

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    # 测试基础设施与 ci.yml 的 test 作业逐字一致（由脚本从 ci.yml 截取）：
    # IT 靠 env 存在性触发，此前这里没有 service 容器，IT 全部静默跳过、跑成弱化版。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: amz-frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Hygiene
        run: python tools/release/repository_hygiene.py --root .
      # 接线尺（与 ci.yml 一致）
      - name: Endpoint wiring reverse gate
        run: |
          python tools/schema/endpoint_coverage_audit.py --self-test .
          python tools/schema/endpoint_coverage_audit.py --reverse .
      - name: Stub shape gate
        run: |
          python tools/schema/stub_shape_audit.py --self-test .
          python tools/schema/stub_shape_audit.py .
      - name: Param name gate
        run: |
          python tools/schema/param_name_audit.py --self-test .
          python tools/schema/param_name_audit.py .
      - name: Entity/column drift self-test + gate
        run: |
          python tools/schema/entity_column_drift.py --self-test .
          python tools/schema/entity_column_drift.py --gate .
      - name: Critical Checkstyle
        run: mvn -B -ntp checkstyle:check -Dcheckstyle.config.location=checkstyle-critical.xml
      - name: Critical Checkstyle
        run: mvn -B -ntp checkstyle:check -Dcheckstyle.config.location=checkstyle-critical.xml
      - name: Full Maven Test
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
          DB_USERNAME: root
          REDIS_PASSWORD: ''
          RABBITMQ_USERNAME: guest
          RABBITMQ_PASSWORD: guest
          NACOS_ADDR: ''
          AD_MYSQL_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          AD_MYSQL_IT_USER: root
          AD_MYSQL_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
          FLYWAY_ALL_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          FLYWAY_ALL_IT_USER: root
          FLYWAY_ALL_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
          # COLLECTION_UPSERT_IT_* / SETTLEMENT_BATCH_IT_*：台账批量幂等写（ON DUPLICATE KEY UPDATE）
          # 与结算明细批量写（Db.saveBatch）必须"真的经过 MyBatis 执行一遍"。
          # 手工把 SQL 模板代进 mysql 客户端只能证明语句对，证明不了 foreach 展开后的
          # 列名/属性名对应关系，也证明不了重复键抛出来的形态还能被兜底路径认出来。
          # 两者都只操作自己的 *_it 专用库（避开 *_fwit，那是 Flyway IT 的命名空间），不设变量则整类跳过。
          COLLECTION_UPSERT_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          COLLECTION_UPSERT_IT_USER: root
          COLLECTION_UPSERT_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
          SETTLEMENT_BATCH_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          SETTLEMENT_BATCH_IT_USER: root
          SETTLEMENT_BATCH_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
          # LISTING_HEALTH_IT_*：健康度汇总下沉 SQL 后，severity 的大小写敏感只能由真库证明
          # （mock 不走 collation）。同一 *_it 命名空间规则，详见该 IT 的类注释。
          LISTING_HEALTH_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          LISTING_HEALTH_IT_USER: root
          LISTING_HEALTH_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
          # PROFIT_ORDER_COUNT_IT_*：报表订单数改去重口径后，"相加≠全店"（一单跨多 ASIN）
          # 与 <if> 日期边界只有在真 MyBatis 上执行才验得到。
          PROFIT_ORDER_COUNT_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
          PROFIT_ORDER_COUNT_IT_USER: root
          PROFIT_ORDER_COUNT_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
        run: mvn -B -ntp test -fae
      - name: Frontend Install
        working-directory: amz-frontend
        run: npm ci
      - name: Frontend Type Check
        working-directory: amz-frontend
        run: npx vue-tsc --noEmit
      - name: Frontend Unit Tests
        working-directory: amz-frontend
        run: npm run test:run
      - name: Frontend Build
        working-directory: amz-frontend
        run: npm run build
      - name: Release tool tests
        run: python -m unittest tools.release.test_repository_hygiene tools.release.test_release_manifest tools.release.test_services_manifest tools.release.test_release_workflow tools.release.test_rollback_drill tools.release.test_cve_gate tools.release.test_verify_clean_clone -v
      - name: Extract version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_REF_NAME#v}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dryrun-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "image_tag=dryrun-${GITHUB_SHA::7}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: quality-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    # Tag pushes publish; workflow_dispatch is a build-only dry run.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    env:
      IMAGE_TAG: ${{ needs.quality-gate.outputs.image_tag }}
      # Flyway IT 环境变量（与 ci.yml test 作业对齐）：
      # FLYWAY_ALL_IT_* / COLLECTION_UPSERT_IT_* / SETTLEMENT_BATCH_IT_* /
      # LISTING_HEALTH_IT_* / PROFIT_ORDER_COUNT_IT_* 全部补上，否则 release 的 Full Maven Test
      # 会漏掉这些迁移验证（ci.yml test 有、release.yml 没有）。
      FLYWAY_ALL_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
      FLYWAY_ALL_IT_USER: root
      FLYWAY_ALL_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
      COLLECTION_UPSERT_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
      COLLECTION_UPSERT_IT_USER: root
      COLLECTION_UPSERT_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
      SETTLEMENT_BATCH_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
      SETTLEMENT_BATCH_IT_USER: root
      SETTLEMENT_BATCH_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
      LISTING_HEALTH_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
      LISTING_HEALTH_IT_USER: root
      LISTING_HEALTH_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
      PROFIT_ORDER_COUNT_IT_URL: 'jdbc:mysql://127.0.0.1:3306/amz_ad_it?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
      PROFIT_ORDER_COUNT_IT_USER: root
      PROFIT_ORDER_COUNT_IT_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_root_pass' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake images
        uses: docker/bake-action@v7
        env:
          # docker-bake.hcl variables are overridden by same-named environment
          # variables, so the workflow-level REGISTRY=ghcr.io would silently
          # strip the owner namespace and make every push fail with 400.
          REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          # docker-bake.hcl defaults TAG to "dev"; override it so the pushed
          # tag is the release version. The bake file appends GIT_SHA to every
          # tag, producing the immutable IMAGE_TAG used below.
          TAG: ${{ needs.quality-gate.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          push: ${{ github.event_name == 'push' }}
          provenance: false
      - name: Extract bake metadata digest
        id: bake-metadata
        if: github.event_name == 'push'
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM for every release image
        if: github.event_name == 'push'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p sboms
          for name in ${RELEASE_IMAGES}; do
            echo "::group::syft amazonerp-${name}"
            docker run --rm \
              -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
              anchore/syft:latest \
              "registry:${REGISTRY}/${OWNER}/amazonerp-${name}:${IMAGE_TAG}" \
              -o spdx-json > "sboms/${name}.spdx.json"
            echo "::endgroup::"
          done
      # 17 个镜像全部逐一扫描，并且每一个都要过 cve_gate.py 门禁（HIGH 与 CRITICAL）。
      #
      # 为什么不再用 anchore/scan-action 的 fail-build: true / grype --fail-on high：这两者
      # 对任何 HIGH/CRITICAL 一律失败。SkyWalking Java Agent 内置 netty 4.1.124.Final，在
      # 16 个 Java 镜像里各产生 15 条 HIGH/CRITICAL，而 apache/skywalking-java 的最新版本
      # 就是 9.7.0、上游无修复可用，于是那两种写法只剩两个结局：门禁永远红，或者有人悄悄把
      # 它关掉。cve_gate 沿用同样的 severity cutoff，但只在 finding 命中一条具名、有 owner、
      # 有 expires 的豁免时才放行，豁免到期即让 finding 重新变回失败。未豁免的 HIGH/CRITICAL
      # 依旧阻断发布，且没有任何一步把失败吞掉（禁止任何 or-true 式兜底）。
      #
      # 只扫 gateway 会给出错误结论：gateway 是 WebFlux（无 Tomcat），恰好是 17 个镜像里最
      # 干净的一个；实测其他服务在修复前各有 28~35 个 HIGH/CRITICAL。
      - name: Scan + gate every release image
        if: github.event_name == 'push'
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.quality-gate.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p scans /tmp/grype-cache
          # 17 次扫描共用一份漏洞库：GRYPE_DB_CACHE_DIR 挂到宿主机目录，否则每个镜像都会
          # 重新下载一遍 DB。
          for name in ${RELEASE_IMAGES}; do
            echo "::group::grype amazonerp-${name}"
            docker run --rm \
              -e GRYPE_DB_CACHE_DIR=/cache \
              -v "/tmp/grype-cache:/cache" \
              -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
              anchore/grype:latest \
              "registry:${REGISTRY}/${OWNER}/amazonerp-${name}:${IMAGE_TAG}" \
              -o json > "scans/${name}.json"
            echo "::endgroup::"
            echo "::group::cve_gate amazonerp-${name}"
            # --fail-on-stale 故意不加：豁免变多余只说明该删，不该阻断一次发布；到期仍然是
            # 致命的，因为过期豁免会让它覆盖的 finding 直接变成 violation。
            python tools/release/cve_gate.py check \
              --scan "scans/${name}.json" \
              --image "amazonerp-${name}" \
              --cutoff high \
              --report "scans/${name}.gate.json"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: cve-gate-reports
          path: scans/*.gate.json
          if-no-files-found: error
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: Cosign sign every image digest
        if: github.event_name == 'push'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for name in ${RELEASE_IMAGES}; do
            REF="${REGISTRY}/${OWNER}/amazonerp-${name}:${IMAGE_TAG}"
            DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
            cosign sign --yes "${REF%:*}@${DIGEST}"
          done
      - name: Generate release manifest
        if: github.event_name == 'push'
        run: |
          python tools/release/release_manifest.py build \
            --root . \
            --commit "${{ github.sha }}" \
            --version "${{ needs.quality-gate.outputs.version }}" \
            --image-ref "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --image-digest "${{ steps.bake-metadata.outputs.digest }}" \
            --output ./release-manifest.json
      - name: Verify release manifest
        if: github.event_name == 'push'
        run: python tools/release/release_manifest.py verify --manifest ./release-manifest.json --root .
      - name: Checksums
        if: github.event_name == 'push'
        run: |
          mkdir -p release-assets
          cp release-manifest.json release-assets/
          cp sboms/*.spdx.json release-assets/
          cd release-assets
          sha256sum release-manifest.json *.spdx.json > checksums.sha256
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: release-assets
          path: |
            release-assets/*
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*
      # 回滚演练（plan 干跑）：当前 manifest 对比上一版 manifest，产出 kubectl set image
      # 的回滚计划但不执行。此前该工具只在单测里活着，CLI 到 manifest 的链路从未跑过。
      - name: Rollback drill plan (dry-run)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK_NAMESPACE: ${{ vars.ROLLBACK_NAMESPACE || 'amz-erp' }}
        run: |
          set -euo pipefail
          # git tag -l 恒 exit 0，首次发布时 prev_tag 为空走显式 exit 0——
          # 失败掩蔽写法（两个竖线接 true）已被契约测试列为禁词，注释里都不能出现
          # --sort=-creatordate 用的是 tag 对象创建时间，本地提前建 tag 或同秒批量建时排序可能与发布顺序不符；
          # --sort=-v:refname 用版本号语义排序（v1.2.3 < v1.2.4），保证取到上一版稳定 tag。
          prev_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n 2p)"
          if [ -z "$prev_tag" ]; then
            echo "没有上一版 tag，跳过回滚演练（首次发布）"
            exit 0
          fi
          # 上一版 tag 可能是发布失败的（没有 GitHub Release / 没有 manifest 资产）。
          # 没有基线就无法演练：显式跳过并说明原因，下一次发布会有真实上一版 manifest。
          if ! gh release view "$prev_tag" --json assets --jq '.assets[].name' | grep -q '^release-manifest\.json$'; then
            echo "上一版 $prev_tag 没有已发布的 release-manifest.json（该次发布未完成），跳过回滚演练"
            exit 0
          fi
          gh release download "$prev_tag" --pattern 'release-manifest.json' --output previous-manifest.json
          python tools/release/rollback_drill.py plan             --current ./release-manifest.json             --previous ./previous-manifest.json             --namespace "$ROLLBACK_NAMESPACE"             --output ./rollback-plan.json
          python -c "import json,io;plan=json.load(io.open('rollback-plan.json',encoding='utf-8'));print('回滚计划条目数:',len(plan.get('steps',plan.get('images',[]))))"

  # verify_clean_clone.ps1 是 PowerShell：只在 windows runner 上有意义。
  # 手动触发（workflow_dispatch 时 quality-gate/release 也会跑，本作业仅额外验证干净克隆复现）。
  verify-clean-clone-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Clean clone verify (PowerShell)
        shell: pwsh
        run: ./tools/release/verify_clean_clone.ps1
