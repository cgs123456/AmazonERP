# JWT 安全配置（集中占位）。
# 各微服务通过环境变量 JWT_SECRET_KEY 注入实际密钥；未配置时 JwtUtil @PostConstruct 拒绝启动。
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}
  # Token 过期时间（毫秒），默认 86400000 = 24 小时；可通过环境变量 JWT_EXPIRE_TIME 覆盖
  expire-time: ${JWT_EXPIRE_TIME:86400000}
