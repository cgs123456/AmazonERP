# 首次部署专用：把一条或多条 SP-API 店铺凭证加密导入 amz_spapi。
# 前置条件：
#   1) MySQL 已就绪，且 amz-mysql-init Job 已创建 amz_spapi 空库；
#   2) 已通过 out-of-band 方式创建 Secret：
#      kubectl -n amz-erp create secret generic amz-spapi-credential-bootstrap \
#        --from-file=credentials.json=/secure/path/spapi-credentials.json
#   3) 凭证 JSON 结构与 docs/examples/spapi-credentials.example.json 一致。
#
# 导入成功后立即删除 Secret；随后 prod Deployment 的启动自检会逐条校验字段完整性。
apiVersion: batch/v1
kind: Job
metadata:
  name: amz-service-spapi-credential-bootstrap
  namespace: amz-erp
  labels:
    app: amz-service-spapi-bootstrap
    tier: bootstrap
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: amz-service-spapi-bootstrap
        tier: bootstrap
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_spapi'" | grep -qx '1'; do
                echo "waiting for schema amz_spapi..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: credential-bootstrap
          image: amazon-erp/amz-service-spapi:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: bootstrap }
            - { name: SPAPI_BOOTSTRAP_CREDENTIAL_FILE, value: /etc/spapi-bootstrap/credentials.json }
            - { name: SPAPI_BOOTSTRAP_EXIT_AFTER_LOAD, value: "true" }
            - { name: SPAPI_REQUIRE_CREDENTIALS, value: "false" }
            - { name: SPAPI_CREDENTIAL_STORE_FAIL_ON_DB_ERROR, value: "true" }
            - { name: SPAPI_CREDENTIAL_CACHE_MAX_ENTRIES, value: "1000" }
            - { name: SPAPI_CREDENTIAL_CACHE_TTL_SECONDS, value: "600" }
            - { name: SPAPI_ACTIVE_SHOP_IDS_TTL_SECONDS, value: "60" }
            - { name: SPAPI_OUTBOX_SCHEDULER_ENABLED, value: "false" }
            - { name: NACOS_ADDR, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: NACOS_ADDR } } }
            - { name: MYSQL_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } } }
            - { name: MYSQL_SLAVE_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_SLAVE_HOST } } }
            - { name: MYSQL_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST } } }
            - { name: REDIS_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT } } }
            - { name: RABBITMQ_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_HOST } } }
            - { name: RABBITMQ_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_PORT } } }
            - { name: AWS_REGION, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AWS_REGION } } }
            - { name: JWT_ISSUER, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE } } }
            - { name: TZ, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: TZ } } }
            - { name: JAVA_OPTS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } } }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD } } }
            - { name: RABBITMQ_USERNAME, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_USERNAME } } }
            - { name: RABBITMQ_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_PASSWORD } } }
            - { name: JWT_SECRET_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY } } }
            - { name: AMZ_CRYPTO_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AMZ_CRYPTO_KEY } } }
            - { name: AWS_ACCESS_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AWS_ACCESS_KEY } } }
            - { name: AWS_SECRET_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AWS_SECRET_KEY } } }
          volumeMounts:
            - name: credential-bootstrap
              mountPath: /etc/spapi-bootstrap
              readOnly: true
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: credential-bootstrap
          secret:
            secretName: amz-spapi-credential-bootstrap
            defaultMode: 0400
            optional: false
