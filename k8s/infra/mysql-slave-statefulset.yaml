# MySQL 8.0 只读副本（slave） StatefulSet + Service + PVC
# 用途：业务服务读流量分流，减轻主库压力
# 注意：本文件仅提供容器编排，主从复制拓扑需在 MySQL 内部配置：
#   CHANGE MASTER TO MASTER_HOST='mysql.amz-erp.svc.cluster.local',
#   MASTER_USER='repl', MASTER_PASSWORD='...', MASTER_AUTO_POSITION=1;
#   START REPLICA;
# 生产环境建议使用 MySQLOperator / Orchestrator 自动化主从管理
apiVersion: v1
kind: Service
metadata:
  name: mysql-slave
  namespace: amz-erp
  labels:
    app: mysql-slave
    tier: infra
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app: mysql-slave
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-slave
  namespace: amz-erp
  labels:
    app: mysql-slave
    tier: infra
spec:
  serviceName: mysql-slave
  replicas: 1
  selector:
    matchLabels:
      app: mysql-slave
  template:
    metadata:
      labels:
        app: mysql-slave
        tier: infra
    spec:
      containers:
        - name: mysql-slave
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amz-erp-secret
                  key: DB_PASSWORD
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: TZ
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-authentication-plugin=mysql_native_password
            - --max-connections=500
            - --innodb-buffer-pool-size=512M
            - --server-id=2
            - --relay-log=relay-bin
            - --read-only=ON
            - --super-read-only=ON
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: mysql-slave-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-slave-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
