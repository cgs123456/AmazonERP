# 敏感配置 Secret —— 所有值均为 base64 编码占位
# 部署前请用真实值替换，生成方式：echo -n 'your-secret' | base64
# 严禁将真实密钥提交到 Git 仓库，生产环境建议使用 Sealed-Secret / External Secrets / Vault
apiVersion: v1
kind: Secret
metadata:
  name: amz-erp-secret
  namespace: amz-erp
  labels:
    app.kubernetes.io/part-of: amazon-erp
type: Opaque
data:
  # ====== JWT 鉴权密钥（HMAC-SHA256，建议 64 字节随机串） ======
  # 占位值：CHANGE_ME_TO_64_BYTES_RANDOM_SECRET_KEY_FOR_JWT_HMAC_SHA256!!!
  JWT_SECRET_KEY: Q0hBTkdfTUVfVE9fNjRfQllURVNfUkFORE9NX1NFQ1JFVF9LRVlfRk9SX0pXVF9ITUFDX1NIQTI1NiEhIQ==

  # ====== AES-256-GCM 加密密钥（32 字节 base64 编码），用于加密 SP-API 凭证 ======
  # 占位值（32 字节随机串，base64 编码后）
  AMZ_CRYPTO_KEY: Y2hhbmdlX21lXzMyX2J5dGVzX2tleV9wbGVhc2VfMjU2IQ==

  # ====== MySQL 凭证 ======
  # 占位值：root
  DB_USERNAME: cm9vdA==
  # 占位值：root123
  DB_PASSWORD: cm9vdDEyMw==

  # ====== Redis 密码 ======
  # 占位值：redis123
  REDIS_PASSWORD: cmVkaXMxMjM=

  # ====== RabbitMQ 凭证 ======
  # 占位值：admin
  RABBITMQ_USERNAME: YWRtaW4=
  # 占位值：rabbitmq123
  RABBITMQ_PASSWORD: cmFiYml0bXExMjM=

  # ====== MongoDB 凭证 ======
  # 占位值：root
  MONGO_USERNAME: cm9vdA==
  # 占位值：mongo123
  MONGO_PASSWORD: bW9uZ28xMjM=

  # ====== AWS SP-API 凭证 ======
  # 占位值：AKIACHANGEME
  AWS_ACCESS_KEY: QUtJQUNIQU5HRU1F
  # 占位值：secretchangeme
  AWS_SECRET_KEY: c2VjcmV0Y2hhbmdlbWU=
