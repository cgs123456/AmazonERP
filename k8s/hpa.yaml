# =====================================================================
# 集中式 HPA（HorizontalPodAutoscaler）配置 —— 所有微服务
# =====================================================================
# 注意：本文件与各 services/*.yaml 中内嵌的 HPA 是二选一关系。
# - 方式 A（推荐）：使用本集中文件管理所有 HPA，便于统一调参
#   执行：kubectl apply -f hpa.yaml
#   使用本文件前请删除 services/*.yaml 中的 HPA 段落，避免同名资源冲突
# - 方式 B：使用 services/*.yaml 中内嵌的 HPA（已默认创建），跳过本文件
# =====================================================================
# 扩缩容策略（生产最佳实践）：
# - 双指标：CPU>70% 或 Memory>80% 触发扩容
# - 扩容快：冷却 30s，单次最多扩 4 个 Pod，快速承接流量峰值
# - 缩容慢：稳定窗口 300s，避免流量抖动导致频繁缩容
# - 最小 2 副本保证可用性，最大 5 副本限制资源成本
# 业务高峰期可手动调整 maxReplicas 上限
# =====================================================================
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-gateway-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-gateway }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 4, periodSeconds: 30 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
      selectPolicy: Min
