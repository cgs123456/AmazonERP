# amz-service-user —— 用户中心微服务（端口 8080）
apiVersion: v1
kind: Service
metadata:
  name: amz-service-user
  namespace: amz-erp
  labels:
    app: amz-service-user
    tier: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: amz-service-user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-user
  namespace: amz-erp
  labels:
    app: amz-service-user
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amz-service-user
  template:
    metadata:
      labels:
        app: amz-service-user
        tier: service
    spec:
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_user'" | grep -qx '1'; do
                echo "waiting for schema amz_user..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: amz-service-user
          image: amazon-erp/amz-service-user:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SW_AGENT_NAME
              value: amz-service-user
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: skywalking-oap.amz-erp.svc.cluster.local:11800
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: NACOS_ADDR
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: MYSQL_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: REDIS_PORT
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: RABBITMQ_PORT
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amz-erp-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amz-erp-secret
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amz-erp-secret
                  key: REDIS_PASSWORD
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amz-erp-secret
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amz-erp-secret
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amz-erp-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: JWT_AUDIENCE
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: TZ
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: JAVA_OPTS
            - { name: AMZ_CRYPTO_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AMZ_CRYPTO_KEY } } }
            # 与其它清单同名：CRYPTO_KEY 经宽松绑定落到 crypto.key；值复用已有的 AMZ_CRYPTO_KEY 键。
            - { name: CRYPTO_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AMZ_CRYPTO_KEY } } }
            - { name: OSS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: OSS_ACCESS_KEY_ID } } }
            - { name: OSS_ACCESS_KEY_SECRET, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: OSS_ACCESS_KEY_SECRET } } }
            - { name: OSS_BUCKET_NAME, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: OSS_BUCKET_NAME } } }
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-user-hpa
  namespace: amz-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: amz-service-user
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
