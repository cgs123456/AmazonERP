# amz-service-logistics —— 物流微服务（端口 8100，DB: amz_logistics）
apiVersion: v1
kind: Service
metadata:
  name: amz-service-logistics
  namespace: amz-erp
  labels: { app: amz-service-logistics, tier: service }
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8100, targetPort: 8100, protocol: TCP }
  selector: { app: amz-service-logistics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-logistics
  namespace: amz-erp
  labels: { app: amz-service-logistics, tier: service }
spec:
  replicas: 2
  selector: { matchLabels: { app: amz-service-logistics } }
  template:
    metadata:
      labels: { app: amz-service-logistics, tier: service }
    spec:
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_logistics'" | grep -qx '1'; do
                echo "waiting for schema amz_logistics..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: amz-service-logistics
          image: amazon-erp/amz-service-logistics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8100, protocol: TCP }
          env:
            - { name: SPRING_PROFILES_ACTIVE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPRING_PROFILES_ACTIVE } } }
            - { name: NACOS_ADDR, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: NACOS_ADDR } } }
            - { name: MYSQL_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } } }
            - { name: MYSQL_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST } } }
            - { name: REDIS_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } } }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD } } }
            - { name: JWT_SECRET_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY } } }
            - { name: JWT_ISSUER, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE } } }
            - { name: TZ, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: TZ } } }
            - { name: JAVA_OPTS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS } } }
            - { name: AMZ_17TRACK_BASE_URL, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_17TRACK_BASE_URL } } }
            - { name: AMZ_TRACKING_MAX_EXISTING_EVENTS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_TRACKING_MAX_EXISTING_EVENTS } } }
            - { name: AMZ_17TRACK_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AMZ_17TRACK_KEY } } }
            - { name: AMZ_LOGISTICS_DELAY_CRON, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_DELAY_CRON } } }
            - { name: AMZ_LOGISTICS_DELAY_GRACE_DAYS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_DELAY_GRACE_DAYS } } }
            - { name: AMZ_LOGISTICS_DELAY_BATCH_SIZE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_DELAY_BATCH_SIZE } } }
            - { name: AMZ_LOGISTICS_DELAY_MAX_SCAN, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_DELAY_MAX_SCAN } } }
            - { name: AMZ_LOGISTICS_DELAY_LEASE_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_DELAY_LEASE_SECONDS } } }
            - { name: AMZ_LOGISTICS_STALE_HOURS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_STALE_HOURS } } }
            - { name: AMZ_LOGISTICS_SYNC_INTERVAL_MS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_SYNC_INTERVAL_MS } } }
            - { name: AMZ_LOGISTICS_SYNC_LEASE_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_SYNC_LEASE_SECONDS } } }
            - { name: AMZ_LOGISTICS_SYNC_MAX_PER_ROUND, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_SYNC_MAX_PER_ROUND } } }
            - { name: AMZ_LOGISTICS_TRANSFER_APPROVAL_STALE_DAYS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_TRANSFER_APPROVAL_STALE_DAYS } } }
            - { name: AMZ_LOGISTICS_DASHBOARD_AGGREGATION_SCAN_LIMIT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_DASHBOARD_AGGREGATION_SCAN_LIMIT } } }
            - { name: AMZ_LOGISTICS_TRANSFER_STALE_DAYS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_TRANSFER_STALE_DAYS } } }
            - { name: AMZ_LOGISTICS_TRANSIT_WINDOW_DAYS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_LOGISTICS_TRANSIT_WINDOW_DAYS } } }
            - { name: AMZ_TRACKING_ENABLED, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AMZ_TRACKING_ENABLED } } }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1536Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8100 }
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8100 }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-logistics-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-service-logistics }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
