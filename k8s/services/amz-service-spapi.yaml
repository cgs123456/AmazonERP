# amz-service-spapi —— SP-API 集成微服务（端口 8096，DB: amz_spapi，读写分离）
# 注：MYSQL_SLAVE_HOST 由 ConfigMap 提供，DataSourceConfig 中根据 @DS("slave") 注解路由读流量
apiVersion: v1
kind: Service
metadata:
  name: amz-service-spapi
  namespace: amz-erp
  labels:
    app: amz-service-spapi
    tier: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      protocol: TCP
  selector:
    app: amz-service-spapi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-spapi
  namespace: amz-erp
  labels:
    app: amz-service-spapi
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amz-service-spapi
  template:
    metadata:
      labels:
        app: amz-service-spapi
        tier: service
    spec:
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_spapi'" | grep -qx '1'; do
                echo "waiting for schema amz_spapi..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: amz-service-spapi
          image: amazon-erp/amz-service-spapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPRING_PROFILES_ACTIVE } }
            - name: NACOS_ADDR
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: NACOS_ADDR } }
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_SLAVE_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_SLAVE_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT } }
            - name: RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_HOST } }
            - name: RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_PORT } }
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: AWS_REGION } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD } }
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_PASSWORD } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY } }
            - name: AMZ_CRYPTO_KEY
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AMZ_CRYPTO_KEY } }
            - name: AWS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AWS_ACCESS_KEY } }
            - name: AWS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AWS_SECRET_KEY } }
            - name: JWT_ISSUER
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER } }
            - name: JWT_AUDIENCE
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: TZ } }
            - name: JAVA_OPTS
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS } }
            - { name: SPAPI_ALLOWLIST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_ALLOWLIST } } }
            - { name: SPAPI_APP_NAME, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_APP_NAME } } }
            - { name: SPAPI_APP_VERSION, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_APP_VERSION } } }
            - { name: SPAPI_BASE_URL_OVERRIDE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_BASE_URL_OVERRIDE } } }
            - { name: SPAPI_LANGUAGE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_LANGUAGE } } }
            - { name: SPAPI_LWA_ENDPOINT_OVERRIDE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_LWA_ENDPOINT_OVERRIDE } } }
            - { name: SPAPI_PLATFORM, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_PLATFORM } } }
            - { name: SPAPI_REQUIRE_CREDENTIALS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_REQUIRE_CREDENTIALS } } }
            - { name: SPAPI_CREDENTIAL_STORE_FAIL_ON_DB_ERROR, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_CREDENTIAL_STORE_FAIL_ON_DB_ERROR } } }
            - { name: SPAPI_CREDENTIAL_CACHE_MAX_ENTRIES, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_CREDENTIAL_CACHE_MAX_ENTRIES } } }
            - { name: SPAPI_CREDENTIAL_CACHE_TTL_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_CREDENTIAL_CACHE_TTL_SECONDS } } }
            - { name: SPAPI_ACTIVE_SHOP_IDS_TTL_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_ACTIVE_SHOP_IDS_TTL_SECONDS } } }
            - { name: SPAPI_RESTRICTED_DATA_ENABLED, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_RESTRICTED_DATA_ENABLED } } }
            - { name: SPAPI_RESTRICTED_DATA_REFRESH_SKEW_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_RESTRICTED_DATA_REFRESH_SKEW_SECONDS } } }
            - { name: SPAPI_RESTRICTED_DATA_MAX_CACHE_ENTRIES, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_RESTRICTED_DATA_MAX_CACHE_ENTRIES } } }
            - { name: SPAPI_ORDER_PII_SYNC_ENABLED, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_ORDER_PII_SYNC_ENABLED } } }
            - { name: SPAPI_USER_AGENT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_USER_AGENT } } }
            - { name: SPAPI_OUTBOX_SCHEDULER_ENABLED, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_OUTBOX_SCHEDULER_ENABLED } } }
            - { name: SPAPI_OUTBOX_SCHEDULER_DELAY_MS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_OUTBOX_SCHEDULER_DELAY_MS } } }
            - { name: SPAPI_OUTBOX_BATCH_SIZE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_OUTBOX_BATCH_SIZE } } }
            - { name: SPAPI_OUTBOX_MAX_ATTEMPTS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_OUTBOX_MAX_ATTEMPTS } } }
            - { name: SPAPI_OUTBOX_BASE_DELAY_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_OUTBOX_BASE_DELAY_SECONDS } } }
            - { name: SPAPI_OUTBOX_REPLAY_CLAIM_TIMEOUT_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_OUTBOX_REPLAY_CLAIM_TIMEOUT_SECONDS } } }
            - { name: SPAPI_NOTIFICATIONS_ENABLED, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_ENABLED } } }
            - { name: SPAPI_NOTIFICATIONS_SOURCE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_SOURCE } } }
            - { name: SPAPI_NOTIFICATIONS_QUEUE_URL, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_QUEUE_URL } } }
            - { name: SPAPI_NOTIFICATIONS_REGION, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_REGION } } }
            - { name: SPAPI_NOTIFICATIONS_STS_ROLE_ARN, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_STS_ROLE_ARN } } }
            - { name: SPAPI_NOTIFICATIONS_WAIT_TIME_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_WAIT_TIME_SECONDS } } }
            - { name: SPAPI_NOTIFICATIONS_MAX_MESSAGES, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_MAX_MESSAGES } } }
            - { name: SPAPI_NOTIFICATIONS_VISIBILITY_TIMEOUT_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_VISIBILITY_TIMEOUT_SECONDS } } }
            - { name: SPAPI_NOTIFICATIONS_BATCH_SIZE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_BATCH_SIZE } } }
            - { name: SPAPI_NOTIFICATIONS_MAX_ATTEMPTS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_MAX_ATTEMPTS } } }
            - { name: SPAPI_NOTIFICATIONS_BASE_DELAY_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_BASE_DELAY_SECONDS } } }
            - { name: SPAPI_NOTIFICATIONS_LEASE_TIMEOUT_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_LEASE_TIMEOUT_SECONDS } } }
            - { name: SPAPI_NOTIFICATIONS_PAYLOAD_MAX_BYTES, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_PAYLOAD_MAX_BYTES } } }
            - { name: SPAPI_NOTIFICATIONS_SUBSCRIPTION_SYNC_ENABLED, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_SUBSCRIPTION_SYNC_ENABLED } } }
            - { name: SPAPI_NOTIFICATIONS_MOCK_SCENARIO, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPAPI_NOTIFICATIONS_MOCK_SCENARIO } } }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2000m", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8096 }
            initialDelaySeconds: 50
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8096 }
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-spapi-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-service-spapi }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
