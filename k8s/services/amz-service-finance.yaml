# amz-service-finance —— 财务微服务（端口 8103，DB: amz_finance）
apiVersion: v1
kind: Service
metadata:
  name: amz-service-finance
  namespace: amz-erp
  labels: { app: amz-service-finance, tier: service }
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8103, targetPort: 8103, protocol: TCP }
  selector: { app: amz-service-finance }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-finance
  namespace: amz-erp
  labels: { app: amz-service-finance, tier: service }
spec:
  replicas: 2
  selector: { matchLabels: { app: amz-service-finance } }
  template:
    metadata:
      labels: { app: amz-service-finance, tier: service }
    spec:
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_finance'" | grep -qx '1'; do
                echo "waiting for schema amz_finance..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: amz-service-finance
          image: amazon-erp/amz-service-finance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8103, protocol: TCP }
          env:
            - { name: SPRING_PROFILES_ACTIVE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPRING_PROFILES_ACTIVE } } }
            - { name: SW_AGENT_NAME, value: amz-service-finance }
            # 与 compose 同名：CRYPTO_KEY 经宽松绑定落到 crypto.key；值复用 amz-erp-secret 里已有的 AMZ_CRYPTO_KEY。
            - { name: CRYPTO_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AMZ_CRYPTO_KEY } } }
            - { name: SW_AGENT_COLLECTOR_BACKEND_SERVICES, value: skywalking-oap.amz-erp.svc.cluster.local:11800 }
            - { name: NACOS_ADDR, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: NACOS_ADDR } } }
            - { name: MYSQL_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } } }
            - { name: MYSQL_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST } } }
            - { name: REDIS_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT } } }
            - { name: RABBITMQ_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_HOST } } }
            - { name: RABBITMQ_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_PORT } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } } }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD } } }
            - { name: RABBITMQ_USERNAME, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_USERNAME } } }
            - { name: RABBITMQ_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_PASSWORD } } }
            - { name: JWT_SECRET_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY } } }
            - { name: JWT_ISSUER, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE } } }
            - { name: TZ, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: TZ } } }
            - { name: JAVA_OPTS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS } } }
            - { name: KINGDEE_API_GATEWAY, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_API_GATEWAY } } }
            - { name: KINGDEE_DB_ID, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_DB_ID } } }
            - { name: KINGDEE_USER_NAME, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_USER_NAME } } }
            - { name: KINGDEE_APP_ID, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_APP_ID } } }
            - { name: KINGDEE_APP_SECRET, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: KINGDEE_APP_SECRET } } }
            - { name: KINGDEE_LCID, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_LCID } } }
            - { name: KINGDEE_ACCOUNT_BOOK_NUMBER, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_ACCOUNT_BOOK_NUMBER } } }
            - { name: KINGDEE_VOUCHER_GROUP_NUMBER, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_VOUCHER_GROUP_NUMBER } } }
            - { name: KINGDEE_CURRENCY_NUMBER, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_CURRENCY_NUMBER } } }
            - { name: KINGDEE_EXCHANGE_RATE_TYPE_NUMBER, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_EXCHANGE_RATE_TYPE_NUMBER } } }
            - { name: KINGDEE_SYNC_LEASE_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KINGDEE_SYNC_LEASE_SECONDS } } }
          resources:
            requests: { cpu: "300m", memory: "768Mi" }
            limits: { cpu: "1500m", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8103 }
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8103 }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-finance-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-service-finance }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
