# amz-service-product —— 商品微服务（端口 8095，DB: amz_product）
apiVersion: v1
kind: Service
metadata:
  name: amz-service-product
  namespace: amz-erp
  labels:
    app: amz-service-product
    tier: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8095
      targetPort: 8095
      protocol: TCP
  selector:
    app: amz-service-product
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-product
  namespace: amz-erp
  labels:
    app: amz-service-product
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amz-service-product
  template:
    metadata:
      labels:
        app: amz-service-product
        tier: service
    spec:
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_product'" | grep -qx '1'; do
                echo "waiting for schema amz_product..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: amz-service-product
          image: amazon-erp/amz-service-product:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8095
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPRING_PROFILES_ACTIVE } }
            - name: NACOS_ADDR
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: NACOS_ADDR } }
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT } }
            - name: RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_HOST } }
            - name: RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_PORT } }
            - name: ELASTICSEARCH_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: ELASTICSEARCH_HOST } }
            - name: ELASTICSEARCH_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: ELASTICSEARCH_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD } }
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_PASSWORD } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY } }
            - name: JWT_ISSUER
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER } }
            - name: JWT_AUDIENCE
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: TZ } }
            - name: JAVA_OPTS
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS } }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1536Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8095 }
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8095 }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-product-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-service-product }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
