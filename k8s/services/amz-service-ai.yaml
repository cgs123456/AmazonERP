# amz-service-ai —— AI Agent 聊天微服务（端口 8091）
apiVersion: v1
kind: Service
metadata:
  name: amz-service-ai
  namespace: amz-erp
  labels:
    app: amz-service-ai
    tier: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8091
      targetPort: 8091
      protocol: TCP
  selector:
    app: amz-service-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-ai
  namespace: amz-erp
  labels:
    app: amz-service-ai
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amz-service-ai
  template:
    metadata:
      labels:
        app: amz-service-ai
        tier: service
    spec:
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_ai'" | grep -qx '1'; do
                echo "waiting for schema amz_ai..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: amz-service-ai
          image: amazon-erp/amz-service-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: SPRING_PROFILES_ACTIVE } }
            - name: NACOS_ADDR
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: NACOS_ADDR } }
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY } }
            - name: JWT_ISSUER
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER } }
            - name: JWT_AUDIENCE
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: TZ } }
            - name: JAVA_OPTS
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS } }
            - { name: DEEPSEEK_API_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DEEPSEEK_API_KEY } } }
            - { name: DEEPSEEK_API_URL, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: DEEPSEEK_API_URL } } }
            - { name: DEEPSEEK_MODEL_NAME, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: DEEPSEEK_MODEL_NAME } } }
            - { name: DEEPSEEK_TEMPERATURE, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: DEEPSEEK_TEMPERATURE } } }
            - { name: DEEPSEEK_TIMEOUT_SECONDS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: DEEPSEEK_TIMEOUT_SECONDS } } }
            - { name: KNOWLEDGE_ES_BASE_URL, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KNOWLEDGE_ES_BASE_URL } } }
            - { name: KNOWLEDGE_ES_INDEX, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KNOWLEDGE_ES_INDEX } } }
            - { name: KNOWLEDGE_ES_VECTOR_DIMS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: KNOWLEDGE_ES_VECTOR_DIMS } } }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2000m", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8091 }
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8091 }
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-ai-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-service-ai }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
