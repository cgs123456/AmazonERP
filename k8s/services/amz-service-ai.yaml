# amz-service-ai —— AI Agent 聊天微服务（端口 8091）
apiVersion: v1
kind: Service
metadata:
  name: amz-service-ai
  namespace: amz-erp
  labels:
    app: amz-service-ai
    tier: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8091
      targetPort: 8091
      protocol: TCP
  selector:
    app: amz-service-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-ai
  namespace: amz-erp
  labels:
    app: amz-service-ai
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amz-service-ai
  template:
    metadata:
      labels:
        app: amz-service-ai
        tier: service
    spec:
      containers:
        - name: amz-service-ai
          image: amazon-erp/amz-service-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: NACOS_SERVER_ADDR
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: NACOS_SERVER_ADDR } }
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT } }
            - name: MONGODB_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MONGODB_HOST } }
            - name: MONGODB_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MONGODB_PORT } }
            - name: RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_HOST } }
            - name: RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: RABBITMQ_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD } }
            - name: MONGO_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: MONGO_USERNAME } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: MONGO_PASSWORD } }
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: RABBITMQ_PASSWORD } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY } }
            - name: JWT_ISSUER
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER } }
            - name: JWT_AUDIENCE
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: TZ } }
            - name: JAVA_OPTS
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS } }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2000m", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8091 }
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8091 }
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-ai-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-service-ai }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
