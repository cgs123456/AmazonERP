# amz-service-search —— 搜索微服务（端口 8090，依赖 ES）
apiVersion: v1
kind: Service
metadata:
  name: amz-service-search
  namespace: amz-erp
  labels:
    app: amz-service-search
    tier: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
  selector:
    app: amz-service-search
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amz-service-search
  namespace: amz-erp
  labels:
    app: amz-service-search
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amz-service-search
  template:
    metadata:
      labels:
        app: amz-service-search
        tier: service
    spec:
      initContainers:
        - name: wait-for-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export MYSQL_PWD="$DB_PASSWORD"
              until mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" --silent; do
                echo "waiting for MySQL..."
                sleep 2
              done
              until mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u"$DB_USERNAME" -Nse "SELECT 1 FROM information_schema.schemata WHERE schema_name='amz_search'" | grep -qx '1'; do
                echo "waiting for schema amz_search..."
                sleep 2
              done
          env:
            - name: MYSQL_HOST
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } }
            - name: MYSQL_PORT
              valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } }
      containers:
        - name: amz-service-search
          image: amazon-erp/amz-service-search:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: amz-erp-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SW_AGENT_NAME
              value: amz-service-search
            # 与 compose 同名：CRYPTO_KEY 经宽松绑定落到 crypto.key；值复用 amz-erp-secret 里已有的 AMZ_CRYPTO_KEY。
            - { name: CRYPTO_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: AMZ_CRYPTO_KEY } } }
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: skywalking-oap.amz-erp.svc.cluster.local:11800
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef: { name: amz-erp-config, key: NACOS_ADDR }
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: amz-erp-config, key: REDIS_HOST }
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef: { name: amz-erp-config, key: REDIS_PORT }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: amz-erp-secret, key: REDIS_PASSWORD }
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: amz-erp-secret, key: JWT_SECRET_KEY }
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef: { name: amz-erp-config, key: JWT_ISSUER }
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef: { name: amz-erp-config, key: JWT_AUDIENCE }
            - name: TZ
              valueFrom:
                configMapKeyRef: { name: amz-erp-config, key: TZ }
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: { name: amz-erp-config, key: JAVA_OPTS }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_PASSWORD } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: DB_USERNAME } } }
            - { name: EMBEDDING_API_KEY, valueFrom: { secretKeyRef: { name: amz-erp-secret, key: EMBEDDING_API_KEY } } }
            - { name: EMBEDDING_API_URL, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: EMBEDDING_API_URL } } }
            - { name: EMBEDDING_ENABLED, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: EMBEDDING_ENABLED } } }
            - { name: EMBEDDING_MODEL, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: EMBEDDING_MODEL } } }
            - { name: ES_URIS, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: ES_URIS } } }
            - { name: MYSQL_HOST, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_HOST } } }
            - { name: MYSQL_PORT, valueFrom: { configMapKeyRef: { name: amz-erp-config, key: MYSQL_PORT } } }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1536Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8090 }
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8090 }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amz-service-search-hpa
  namespace: amz-erp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amz-service-search }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
