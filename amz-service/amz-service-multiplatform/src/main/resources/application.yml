server:
  port: 8104
spring:
  application:
    name: amz-service-multiplatform
  # 默认启用 mock 模式（离线开发）。生产环境通过 SPRING_PROFILES_ACTIVE 环境变量切换为非 mock
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:123.206.101.247:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:121.37.250.15}:${MYSQL_PORT:3306}/amz_multiplatform?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:121.37.250.15}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# 各平台 API 配置
platform:
  temu:
    app-key: ${TEMU_APP_KEY:}
    app-secret: ${TEMU_APP_SECRET:}
  tiktok:
    app-key: ${TIKTOK_APP_KEY:}
    app-secret: ${TIKTOK_APP_SECRET:}
  shein:
    app-key: ${SHEIN_APP_KEY:}
    app-secret: ${SHEIN_APP_SECRET:}
  # 汇率：币种代码 → CNY
  exchange-rates:
    USD: 7.25
    EUR: 7.85
    GBP: 9.20
    JPY: 0.045

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
