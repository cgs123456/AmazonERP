server:
  port: 8104
spring:
  application:
    name: amz-service-multiplatform
  # 默认启用 mock 模式（离线开发）。生产环境通过 SPRING_PROFILES_ACTIVE 环境变量切换为非 mock
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:123.206.101.247:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:121.37.250.15}:${MYSQL_PORT:3306}/amz_multiplatform?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:121.37.250.15}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# 各平台 API 配置
# 说明：平台凭证（appKey/appSecret/accessToken）已改为按 (shopId, platform)
# 从 amz_platform_account 表读取（多租户），不再以全局 @Value 注入；密钥不落仓库。
# 汇率兜底见下方 amz.exchange-rates（已与 finance 模块对齐）。
platform:
  # 汇率：币种代码 → CNY（兜底；实时由 amz-common GlobalExchangeRateService 拉取）
  exchange-rates:
    USD: 7.25
    EUR: 7.85
    GBP: 9.20
    JPY: 0.045

# 共享汇率服务兜底（amz-common GlobalExchangeRateService；离线时兜底，实时由 exchangerate.host 拉取）
# 注：JPY 由 0.045 校正为 0.046，与 finance 模块对齐 —— 合并前两模块兜底值不一致，
# 同一笔日元金额在两处折算会得到不同 CNY 结果。
amz:
  exchange-rates:
    USD: 7.25
    EUR: 7.85
    GBP: 9.20
    JPY: 0.046
  # 出站 HTTP 弹性策略：第三方电商平台（Temu/TikTok/Shein）响应普遍慢于内部服务，
  # 读超时放宽至 15s；熔断按 target=平台标识 独立隔离，单平台故障不影响其他平台。
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
    max-attempts: 3
    circuit:
      failure-threshold: 5
      open-duration-ms: 30000

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
