server:
  port: 8100
spring:
  application:
    name: amz-service-logistics
  # 默认 prod（fail-closed）：未显式设置时启用真实客户端，缺凭证会显式失败，
  # 而不是静默返回样例数据（P0-57）。离线开发请显式设置 SPRING_PROFILES_ACTIVE=mock。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # ====== Flyway 基线（P0-58）======
  # 表结构的唯一事实源是 classpath:db/migration；Compose 与 k8s 只负责建空库。
  # baseline-on-migrate=false（P0-58 / 2026-09-30 修正）：非空库且无 flyway_schema_history 时，
  # Flyway 会在执行任何 DDL 之前就拒绝启动（fail-fast，报错指明用 baseline() 纳管），
  # 而不是像 true 那样先在 v1 打基线、再重放 V2..Vn 撞 Duplicate key，留下半迁移状态
  # （MySQL DDL 非事务，ad/order/spapi 2026-09-28 实测必炸）。空库路径照常执行 V1..Vn。
  # 纳管存量库请显式 baseline：tools/synthetic-data/apply_migrations.py 已代写基线行。
  flyway:
    baseline-on-migrate: false
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/amz_logistics?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# 物流模块配置
amz:
  logistics:
    # 承运商状态文本 → 内部轨迹状态 的补充映射（内置中英文字典之外的自定义项）。
    # 承运商新增状态词时在此补充即可，无需改代码发版。
    status-mapping: {}
    # 第三方轨迹聚合查询（取数入口 B）。默认关闭：未配置时不发起任何外部请求，
    # 轨迹仍可通过 /logistics/import/* 由外部导入维护（取数入口 A）。
    tracking:
      enabled: ${AMZ_TRACKING_ENABLED:false}
      base-url: ${AMZ_17TRACK_BASE_URL:https://api.17track.net}
      query-path: /track/v2.2/gettrackinfo
      # 凭证仅从环境变量注入，不写入仓库
      api-key: ${AMZ_17TRACK_KEY:}
      api-key-header: 17token
      # 单个运单解析出的轨迹点上限，防御对端返回畸形数据
      max-events-per-shipment: 200
      # 单货件既有轨迹指纹的安全上限。超过时拒绝写入，避免在指纹不完整时制造重复轨迹。
      max-existing-events: ${AMZ_TRACKING_MAX_EXISTING_EVENTS:10000}
      # 承运商 → 17track 承运商代码。留空时请求不带 carrier 字段，
      # 由 17track 按单号特征自动识别（漏配不会导致查不到，只是识别可能较慢）。
      # 代码值请以 17track 官方文档为准，勿凭猜测填写。
      carrier-codes: {}
    # 定时自动同步：取代「运营逐条点同步」，让异常自行浮现
    sync:
      # 调度间隔（毫秒），默认 30 分钟；用 fixedDelay 语义，以上一轮结束为起点
      interval-ms: ${AMZ_LOGISTICS_SYNC_INTERVAL_MS:1800000}
      # 分布式锁租期（秒），须略小于调度间隔，实例崩溃后下一轮可接手
      lease-seconds: ${AMZ_LOGISTICS_SYNC_LEASE_SECONDS:1680}
      # 单轮最多处理货件数：配合按最近取数时间轮换，限量也不会饿死尾部货件
      max-per-round: ${AMZ_LOGISTICS_SYNC_MAX_PER_ROUND:200}
    # 延误重判（依据 ETA，与轨迹拉取解耦）
    delay-check:
      cron: ${AMZ_LOGISTICS_DELAY_CRON:0 0 1 * * ?}
      lease-seconds: ${AMZ_LOGISTICS_DELAY_LEASE_SECONDS:1800}
      # 宽限天数：ETA 已过该天数仍未推进才判延误
      grace-days: ${AMZ_LOGISTICS_DELAY_GRACE_DAYS:0}
      # 按 id 游标分批扫描，避免一次性加载全部非终态货件
      batch-size: ${AMZ_LOGISTICS_DELAY_BATCH_SIZE:500}
      # 单轮最大扫描行数；超过时回滚并告警，禁止静默漏判
      max-scan: ${AMZ_LOGISTICS_DELAY_MAX_SCAN:50000}
    # 看板口径参数（随接口返回，避免前端硬编码造成口径不一致）
    dashboard:
      # 在途货件超过该时长无取数记录即提示「自动同步可能未覆盖」
      stale-threshold-hours: ${AMZ_LOGISTICS_STALE_HOURS:48}
      # 平均头程时效的统计窗口：只统计窗口内送达的样本，避免历史样本拉平近期表现
      transit-window-days: ${AMZ_LOGISTICS_TRANSIT_WINDOW_DAYS:90}
      # 调拨单处于在途超过该天数仍未确认到货，视为卡单并进入待跟进清单
      transfer-stale-days: ${AMZ_LOGISTICS_TRANSFER_STALE_DAYS:7}
      # 调拨单待审批停留超过该天数，提示审批被卡住
      transfer-approval-stale-days: ${AMZ_LOGISTICS_TRANSFER_APPROVAL_STALE_DAYS:3}
      # 单次看板聚合最大扫描行数；超过时返回结果会明确标记不完整，避免静默截断
      aggregation-scan-limit: ${AMZ_LOGISTICS_DASHBOARD_AGGREGATION_SCAN_LIMIT:10000}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

# ====== Actuator / observability contract (P2-1) ======
# Boot 3 default web exposure is health only; /actuator/prometheus would 404.
# probes.enabled must be explicit for non-k8s (compose/local) environments.
# show-details=never prevents leaking datasource details via /actuator/health.
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
