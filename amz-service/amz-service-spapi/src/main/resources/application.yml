server:
  port: 8096
spring:
  # 默认 prod（fail-closed）：未显式设置时启用真实客户端，缺凭证会显式失败，
  # 而不是静默返回样例数据（P0-57）。离线开发请显式设置 SPRING_PROFILES_ACTIVE=mock。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: amz-service-spapi
  # Uploads 控制器会把 multipart 文件读入 byte[]；框架层与控制器层同时限流，
  # 防止超限请求在进入业务前消耗堆内存。生产可通过 SPRING_SERVLET_MULTIPART_* 覆盖。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    sentinel:
      transport:
        dashboard: localhost:8858
      eager: true
      datasource:
        ds1:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            dataId: ${spring.application.name}-sentinel-rules
            groupId: SENTINEL_GROUP
            ruleType: flow
  # ====== 动态数据源（读写分离）配置 ======
  # 由 dynamic-datasource-spring-boot3-starter 自动装配。
  # 默认数据源：master（写）。读流量通过 @DS("slave") 注解路由到从库。
  # 当 MYSQL_SLAVE_HOST 未配置时回退到 master，避免单机环境启动失败。
  # ====== Flyway 基线（P0-58）======
  # 表结构的唯一事实源是 classpath:db/migration；Compose 与 k8s 只负责建空库。
  # baseline-on-migrate=true 是必需的：Flyway 10 默认为 false，非空库且无 flyway_schema_history 时
  # 会直接抛错并让应用拒绝启动（历史环境 14 个服务会同时起不来）。空库仍照常执行 V1。
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/amz_spapi?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_SLAVE_HOST:${MYSQL_HOST:localhost}}:${MYSQL_PORT:3306}/amz_spapi?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
spapi:
  aws-access-key: ${AWS_ACCESS_KEY:}
  aws-secret-key: ${AWS_SECRET_KEY:}
  region: ${AWS_REGION:us-east-1}
  lwa-endpoint: https://api.amazon.com/auth/o2/token
  # ====== 受限数据令牌（RDT，P0-37）======
  # 默认关闭：无凭证/未完成授权时不得尝试换取 RDT，也不得把失败伪装成成功。
  # 取得 Tokens API 权限后显式设置 SPAPI_RESTRICTED_DATA_ENABLED=true。
  restricted-data:
    enabled: ${SPAPI_RESTRICTED_DATA_ENABLED:false}
    refresh-skew-seconds: ${SPAPI_RESTRICTED_DATA_REFRESH_SKEW_SECONDS:60}
    max-cache-entries: ${SPAPI_RESTRICTED_DATA_MAX_CACHE_ENTRIES:1000}
  # 订单 PII 同步独立开关，默认关闭；仅在 Tokens API 权限与沙箱验收通过后开启。
  # 开启后 Orders 与 OrderItems 都只走 RDT，失败不回退 LWA。
  orders:
    pii-sync-enabled: ${SPAPI_ORDER_PII_SYNC_ENABLED:false}
  # ====== 端点覆盖与出站主机白名单（P0-51，仅限非生产）======
  # 用途：把出站指向本地桩 / 录制回放代理，取得 E2 级桩回放证据（无凭证阶段的唯一取证路径）。
  # 硬规则：prod profile 下两项覆盖任一非空 → SpApiEndpointResolver 构造期拒绝启动；
  #         非生产也必须是官方主机或 allowlist 内的精确匹配主机，否则同样拒绝。
  # 覆盖生效期间订单/库存定时同步跳过并告警，避免桩数据落业务表。
  # 示例（仅 dev/联调）：
  #   SPAPI_BASE_URL_OVERRIDE=http://127.0.0.1:19099
  #   SPAPI_LWA_ENDPOINT_OVERRIDE=http://127.0.0.1:19099/auth/o2/token
  #   SPAPI_ALLOWLIST=stub.internal.example.com,stub2.internal.example.com
  base-url-override: ${SPAPI_BASE_URL_OVERRIDE:}
  lwa-endpoint-override: ${SPAPI_LWA_ENDPOINT_OVERRIDE:}
  allowlist: ${SPAPI_ALLOWLIST:}
  # ====== 官方必填 user-agent（P0-35）======
  # SP-API 要求每个请求都带 user-agent，格式：App名/版本 (Language=<语言>/<版本>[; Platform=<平台>])。
  # 留空时的回退策略（SpApiUserAgent.value()）：app-name/app-version 回退内置默认值，
  # language 回退 Java/<JVM 版本>，并打一次 warn 提示配置不完整；不得依赖静默回退上线。
  # 需要逐字指定整串时用 SPAPI_USER_AGENT（优先级最高）。
  app-name: ${SPAPI_APP_NAME:AmazonERP}
  app-version: ${SPAPI_APP_VERSION:1.0-SNAPSHOT}
  language: ${SPAPI_LANGUAGE:}
  platform: ${SPAPI_PLATFORM:}
  user-agent: ${SPAPI_USER_AGENT:}
  # 生产启动自检开关（spec §1.9 A3），默认 false 保持离线开发/CI 口径不变。
  # 置为 true 后：启用 mock profile 或 amz_shop_credential 无任何凭证 → 拒绝启动。
  # 生产由 application-prod.yml 置为 true；仅离线开发可显式关闭。
  startup:
    require-credentials: ${SPAPI_REQUIRE_CREDENTIALS:false}
  # 凭证存储的 DB 故障策略。生产 profile 置为 true；非生产保留离线降级能力。
  credential-store:
    fail-on-db-error: ${SPAPI_CREDENTIAL_STORE_FAIL_ON_DB_ERROR:false}
    # 凭证只按店铺懒加载，并限制进程内密文缓存容量与有效期；
    # 不得改回启动时 selectList(null) 全表预热。
    cache-max-entries: ${SPAPI_CREDENTIAL_CACHE_MAX_ENTRIES:1000}
    cache-ttl-seconds: ${SPAPI_CREDENTIAL_CACHE_TTL_SECONDS:600}
    # 活跃店铺集合只查询 shop_id，并用短 TTL 快照减少调度器重复扫描。
    active-shop-ids-ttl-seconds: ${SPAPI_ACTIVE_SHOP_IDS_TTL_SECONDS:60}
  # ====== SP-API Outbox 重放（P0-52c）======
  # 自动重放只处理到期 FAILED 记录；执行器再次拒绝非 GET/HEAD，DLQ 只能人工重放。
  # 多副本通过数据库原子领取竞争，不依赖单机锁；生产参数必须显式注入并纳入变更审计。
  outbox:
    scheduler-enabled: ${SPAPI_OUTBOX_SCHEDULER_ENABLED:true}
    scheduler-delay-ms: ${SPAPI_OUTBOX_SCHEDULER_DELAY_MS:60000}
    batch-size: ${SPAPI_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${SPAPI_OUTBOX_MAX_ATTEMPTS:4}
    base-delay-seconds: ${SPAPI_OUTBOX_BASE_DELAY_SECONDS:60}
    replay-claim-timeout-seconds: ${SPAPI_OUTBOX_REPLAY_CLAIM_TIMEOUT_SECONDS:900}
  # ====== SP-API 通知入站（Notifications Inbox，spec 2026-09-26）======
  # 默认关闭：通知链路一旦接错不会报错，只会表现为「今天没有通知」，
  # 因此在 SQS 队列与 IAM 角色就绪前不允许默认启用。
  # 启用路径（二者都必须做）：
  #   1) 离线演练：SPAPI_NOTIFICATIONS_ENABLED=true SPAPI_NOTIFICATIONS_SOURCE=mock
  #      （必须同时 SPRING_PROFILES_ACTIVE 不含 prod；prod+mock 会被拒绝启动）
  #   2) 真实接入：SPAPI_NOTIFICATIONS_ENABLED=true SPAPI_NOTIFICATIONS_SOURCE=sqs
  #      并显式设置 SPAPI_NOTIFICATIONS_QUEUE_URL / SPAPI_NOTIFICATIONS_REGION
  #      （可选 SPAPI_NOTIFICATIONS_STS_ROLE_ARN；禁止使用店铺静态 AWS 密钥）
  # 硬规则（违反即拒绝启动，详见 NotificationStartupCheck）：
  #   - 队列只能是 SQS standard；SP-API 不支持 FIFO 投递，顺序由业务层按 eventTime 处理
  #   - lease-timeout-seconds 必须 >= visibility-timeout-seconds
  #     （反过来的话：租期先到期、消息仍在 SQS 不可见窗口内，第二个 Worker 会并发重复处理）
  #   - 消费队列不得使用 amz_shop_credential 中的店铺静态 AWS 密钥
  notifications:
    enabled: ${SPAPI_NOTIFICATIONS_ENABLED:false}
    source: ${SPAPI_NOTIFICATIONS_SOURCE:mock}
    queue-url: ${SPAPI_NOTIFICATIONS_QUEUE_URL:}
    region: ${SPAPI_NOTIFICATIONS_REGION:}
    sts-role-arn: ${SPAPI_NOTIFICATIONS_STS_ROLE_ARN:}
    use-shop-static-credentials: false
    wait-time-seconds: ${SPAPI_NOTIFICATIONS_WAIT_TIME_SECONDS:20}
    max-messages: ${SPAPI_NOTIFICATIONS_MAX_MESSAGES:10}
    visibility-timeout-seconds: ${SPAPI_NOTIFICATIONS_VISIBILITY_TIMEOUT_SECONDS:60}
    batch-size: ${SPAPI_NOTIFICATIONS_BATCH_SIZE:10}
    max-attempts: ${SPAPI_NOTIFICATIONS_MAX_ATTEMPTS:5}
    base-delay-seconds: ${SPAPI_NOTIFICATIONS_BASE_DELAY_SECONDS:30}
    lease-timeout-seconds: ${SPAPI_NOTIFICATIONS_LEASE_TIMEOUT_SECONDS:300}
    payload-max-bytes: ${SPAPI_NOTIFICATIONS_PAYLOAD_MAX_BYTES:262144}
    subscription-sync-enabled: ${SPAPI_NOTIFICATIONS_SUBSCRIPTION_SYNC_ENABLED:true}
    # 订阅对账周期与首次延迟。这里写字面量而非 ${...} 占位符，是刻意避免再引入两个
    # 必填环境变量：对账是旁路观测任务，用默认值即可运行，需要调整时再用
    # SPAPI_NOTIFICATIONS_SUBSCRIPTION_SYNC_INTERVAL_MS 覆盖（Spring 环境变量宽松绑定）。
    subscription-sync-interval-ms: 3600000
    subscription-sync-initial-delay-ms: 60000
    # 入站轮询与 Worker 消费的节奏。同样写字面量而非 ${...} 占位符：
    # 这两个值调的是进程内部循环节奏，不需要按环境差异化注入，
    # 但 Spring 环境变量宽松绑定仍允许用
    # SPAPI_NOTIFICATIONS_POLL_INTERVAL_MS / SPAPI_NOTIFICATIONS_WORKER_INTERVAL_MS 覆盖。
    # 入站间隔取 1s 是与 wait-time-seconds=20 配套的：SQS 长轮询本身会阻塞最长 20s，
    # 空队列时不会形成忙循环；仅在真的拿到消息后才需要尽快回到下一轮。
    poll-interval-ms: 1000
    # Worker 间隔独立于入站：下游（amz-service-order）慢时不该反过来堵住入站，
    # 否则消息会在可见性超时内没被删掉而重投。
    worker-interval-ms: 2000
    mock-scenario: ${SPAPI_NOTIFICATIONS_MOCK_SCENARIO:order-change}
# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
# AES-256-GCM 加密密钥（32 字节 base64 编码），用于加密 SP-API 凭证
crypto:
  key: ${AMZ_CRYPTO_KEY:}

# ====== Actuator 健康探针与限流观测指标 ======
# 限流响应头观测通过 spapi.ratelimit.limit Gauge 暴露；Prometheus 必须显式开放，
# 否则 P0-52b 的结构化出口只在 JVM 内，验收无法抓取。health 细节保持 never。
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
