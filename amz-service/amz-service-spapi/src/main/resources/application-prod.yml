# 生产 profile（SPRING_PROFILES_ACTIVE=prod）。
#
# 本文件只做一件事：把“缺凭证 / 误用 mock profile”从**静默降级**变成**启动失败**（fail-closed）。
# 依据 spec §1.9 A3：生产 profile 启动时必须校验凭证存在性，不通过即拒绝启动。
#
# 注意：
#   1) 生产环境必须显式设置 SPRING_PROFILES_ACTIVE=prod。
#      application.yml 默认也是 prod（fail-closed）；离线样例数据必须显式激活 mock，
#      绝不能把 mock 作为生产回退，否则会把“未接通”伪装成“正常”。
#   2) 若误把 mock 与 prod 同时激活（如 SPRING_PROFILES_ACTIVE=prod,mock），
#      ConnectorStartupCheck 会直接拒绝启动，而不是静默取其一。
#   3) 凭证写入路径见 spec §4.8；加密密钥 AMZ_CRYPTO_KEY 必须是 32 字节 base64，
#      否则 CryptoUtil 在自身初始化阶段即失败（不会读到半可用状态）。
# 4) user-agent（P0-35）不在本文件重复配置：生产同样继承 application.yml 的
#    spapi.app-name / app-version / language（可用 SPAPI_LANGUAGE 等环境变量覆盖）。
#    留空会走 SpApiUserAgent 的一次性 warn 回退，生产建议显式设置 SPAPI_LANGUAGE。
# 5) P0-51：spapi.base-url-override 与 spapi.lwa-endpoint-override 在生产**必须为空**。
#    任一非空会被 SpApiEndpointResolver 在构造 Bean 时抛 IllegalStateException → 应用拒绝启动，
#    不是打印一条 warn 后继续跑。原因：端点覆盖会把 LWA access token 与业务 payload 交给该主机。
#    本地桩/沙箱联调请改用不含 prod 的 profile（如 dev/sandbox），不要在生产放开覆盖。
spapi:
  startup:
    require-credentials: true
  credential-store:
    fail-on-db-error: true
  # 生产固定启用自动重放；下列参数仍可由环境变量覆盖，但不得依赖缺省值静默变化。
  outbox:
    scheduler-enabled: true
    scheduler-delay-ms: 60000
    batch-size: 50
    max-attempts: 4
    base-delay-seconds: 60
    replay-claim-timeout-seconds: 900
  # 通知入站：生产只允许 sqs 事件源（mock 会被 NotificationStartupCheck 拒绝启动）。
  # enabled 仍默认 false：SQS 队列、IAM 角色与订阅映射就绪前必须保持关闭，
  # 否则「队列没接上」会以「今日 0 条通知」的形式静默存在。
  notifications:
    source: sqs
