server:
  port: 8103
spring:
  application:
    name: amz-service-finance
  # 默认 prod：金蝶配置缺失时同步操作显式失败，绝不降级为 Mock 或伪造成功。
  # 本地离线开发请显式设置 SPRING_PROFILES_ACTIVE=mock 启用 Mock 客户端
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # ====== Flyway 基线（P0-58）======
  # 表结构的唯一事实源是 classpath:db/migration；Compose 与 k8s 只负责建空库。
  # baseline-on-migrate=false（P0-58 / 2026-09-30 修正）：非空库且无 flyway_schema_history 时，
  # Flyway 会在执行任何 DDL 之前就拒绝启动（fail-fast，报错指明用 baseline() 纳管），
  # 而不是像 true 那样先在 v1 打基线、再重放 V2..Vn 撞 Duplicate key，留下半迁移状态
  # （MySQL DDL 非事务，ad/order/spapi 2026-09-28 实测必炸）。空库路径照常执行 V1..Vn。
  # 纳管存量库请显式 baseline：tools/synthetic-data/apply_migrations.py 已代写基线行。
  flyway:
    baseline-on-migrate: false
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/amz_finance?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  # B1：凭证生成 MQ 消费者（与 order 服务同口径：手动 ack + prefetch 1 + DLQ）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# 金蝶云星空 Web API 配置。
# api-gateway 必须指向客户 K3Cloud 站点根地址（通常以 /K3Cloud/ 结尾），不是公有云固定域名。
# 配置不完整时连接器不会启动降级，调用同步接口会明确失败并保留 PENDING/FAILED 状态。
kingdee:
  api-gateway: ${KINGDEE_API_GATEWAY:}
  db-id: ${KINGDEE_DB_ID:}
  user-name: ${KINGDEE_USER_NAME:}
  app-id: ${KINGDEE_APP_ID:}
  app-secret: ${KINGDEE_APP_SECRET:}
  lcid: ${KINGDEE_LCID:2052}
  account-book-number: ${KINGDEE_ACCOUNT_BOOK_NUMBER:}
  voucher-group-number: ${KINGDEE_VOUCHER_GROUP_NUMBER:}
  currency-number: ${KINGDEE_CURRENCY_NUMBER:}
  exchange-rate-type-number: ${KINGDEE_EXCHANGE_RATE_TYPE_NUMBER:}

# 共享汇率服务（amz-common GlobalExchangeRateService）离线兜底汇率。
# 运行时每小时从 exchangerate.host 拉取实时汇率覆盖此表；拉取失败沿用此处配置。
# 说明：原 kingdee.exchange-rates 已迁移至此 —— finance/product/multiplatform
# 三套重复汇率实现合并为单一真相源，配置键随之统一为 amz.exchange-rates。
amz:
  finance:
    kingdee:
      # SYNCING 认领租约；超时后允许重新认领，避免进程崩溃导致永久卡死
      sync-lease-seconds: ${KINGDEE_SYNC_LEASE_SECONDS:300}
  exchange-rates:
    USD: 7.25
    EUR: 7.85
    GBP: 9.20
    JPY: 0.046
  # 出站 HTTP 弹性策略（超时 / 重试 / 熔断），未配置时使用组件内置默认值
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    max-attempts: 3
    circuit:
      failure-threshold: 5
      open-duration-ms: 30000

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%traceId] %-5level %logger{36} - %msg%n%wEx"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

# ====== Actuator / observability contract (P2-1) ======
# Boot 3 default web exposure is health only; /actuator/prometheus would 404.
# probes.enabled must be explicit for non-k8s (compose/local) environments.
# show-details=never prevents leaking datasource details via /actuator/health.
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
