server:
  port: 8103
spring:
  application:
    name: amz-service-finance
  # 默认启用 mock 模式（离线开发）。生产环境通过 SPRING_PROFILES_ACTIVE 环境变量切换为非 mock
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:123.206.101.247:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:121.37.250.15}:${MYSQL_PORT:3306}/amz_finance?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:121.37.250.15}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# 金蝶云星空 API 配置
kingdee:
  api-gateway: https://api.kingdee.com
  app-id: ${KINGDEE_APP_ID:}
  app-secret: ${KINGDEE_APP_SECRET:}

# 共享汇率服务（amz-common GlobalExchangeRateService）离线兜底汇率。
# 运行时每小时从 exchangerate.host 拉取实时汇率覆盖此表；拉取失败沿用此处配置。
# 说明：原 kingdee.exchange-rates 已迁移至此 —— finance/product/multiplatform
# 三套重复汇率实现合并为单一真相源，配置键随之统一为 amz.exchange-rates。
amz:
  exchange-rates:
    USD: 7.25
    EUR: 7.85
    GBP: 9.20
    JPY: 0.046
  # 出站 HTTP 弹性策略（超时 / 重试 / 熔断），未配置时使用组件内置默认值
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    max-attempts: 3
    circuit:
      failure-threshold: 5
      open-duration-ms: 30000

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
