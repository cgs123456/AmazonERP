server:
  port: 8097
spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: amz-service-ad
  # 默认 prod（fail-closed）：未显式设置时启用真实客户端，缺凭证会显式失败，
  # 而不是静默返回样例数据（P0-57）。离线开发请显式设置 SPRING_PROFILES_ACTIVE=mock。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # ====== Flyway 基线（P0-58）======
  # 表结构的唯一事实源是 classpath:db/migration；Compose 与 k8s 只负责建空库。
  # baseline-on-migrate=false（P0-58 / 2026-09-30 修正）：非空库且无 flyway_schema_history 时，
  # Flyway 会在执行任何 DDL 之前就拒绝启动（fail-fast，报错指明用 baseline() 纳管），
  # 而不是像 true 那样先在 v1 打基线、再重放 V2..Vn 撞 Duplicate key，留下半迁移状态
  # （MySQL DDL 非事务，ad/order/spapi 2026-09-28 实测必炸）。空库路径照常执行 V1..Vn。
  # 纳管存量库请显式 baseline：tools/synthetic-data/apply_migrations.py 已代写基线行。
  flyway:
    baseline-on-migrate: false
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/amz_ad?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# Amazon Advertising API 配置（独立于 SP-API，需单独申请广告 API 权限）
# 单店铺：完整设置 AD_SHOP_ID / AD_CLIENT_ID / AD_CLIENT_SECRET /
# AD_REFRESH_TOKEN / AD_PROFILE_ID 后，生产 profile 即可直接调用真实 API。
# 多店铺：通过外部配置提供 advertising.credentials.<shopId>.*，禁止跨店铺复用凭证。
advertising:
  api-endpoint: ${AD_API_ENDPOINT:https://advertising-api.amazon.com}
  token-endpoint: ${AD_TOKEN_ENDPOINT:https://api.amazon.com/auth/o2/token}
  shop-id: ${AD_SHOP_ID:}
  client-id: ${AD_CLIENT_ID:}
  client-secret: ${AD_CLIENT_SECRET:}
  refresh-token: ${AD_REFRESH_TOKEN:}
  profile-id: ${AD_PROFILE_ID:}

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%traceId] %-5level %logger{36} - %msg%n%wEx"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

# ====== Actuator / observability contract (P2-1) ======
# Boot 3 default web exposure is health only; /actuator/prometheus would 404.
# probes.enabled must be explicit for non-k8s (compose/local) environments.
# show-details=never prevents leaking datasource details via /actuator/health.
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
