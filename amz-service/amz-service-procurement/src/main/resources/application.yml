server:
  port: 8098
spring:
  application:
    name: amz-service-procurement
  # 默认 prod（fail-closed）：未显式设置时启用真实客户端，缺凭证会显式失败，
  # 而不是静默返回样例数据（P0-57）。离线开发请显式设置 SPRING_PROFILES_ACTIVE=mock。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # ====== Flyway 基线（P0-58）======
  # 表结构的唯一事实源是 classpath:db/migration；Compose 与 k8s 只负责建空库。
  # baseline-on-migrate=true 是必需的：Flyway 10 默认为 false，非空库且无 flyway_schema_history 时
  # 会直接抛错并让应用拒绝启动（历史环境 14 个服务会同时起不来）。空库仍照常执行 V1。
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/amz_procurement?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# 1688 开放平台配置
alibaba:
  app-key: ${ALIBABA_APP_KEY:}
  app-secret: ${ALIBABA_APP_SECRET:}
  # OAuth refresh_token：用于换取 access_token（TokenManager 缓存于 Redis）
  refresh-token: ${ALIBABA_REFRESH_TOKEN:}
  # 1688 API 网关
  gateway: https://gw.open.1688.com/openapi

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
