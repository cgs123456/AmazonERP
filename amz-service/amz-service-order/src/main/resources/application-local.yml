spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  # 本地开发：master/slave 都指向 localhost，单机环境读写分离不生效但可正常启动
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/amz_order?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
        slave:
          url: jdbc:mysql://localhost:3306/amz_order?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: localhost
    port: 5672
    username: ${MQ_USERNAME:admin}
    password: ${MQ_PASSWORD:admin}
