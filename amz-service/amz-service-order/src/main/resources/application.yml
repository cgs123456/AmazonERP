server:
  port: 8105
spring:
  application:
    name: amz-service-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:123.206.101.247:8848}
  # ====== 动态数据源（读写分离）配置 ======
  # 由 dynamic-datasource-spring-boot3-starter 自动装配。
  # 默认数据源：master（写）。读流量通过 @DS("slave") 注解路由到从库。
  # 当 MYSQL_SLAVE_HOST 未配置时回退到 master，避免单机环境启动失败。
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:121.37.250.15}:${MYSQL_PORT:3306}/amz_order?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_SLAVE_HOST:${MYSQL_HOST:121.37.250.15}}:${MYSQL_PORT:3306}/amz_order?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:121.37.250.15}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:123.206.101.247}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
---
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 10000
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
---
# ====== Actuator 健康探针 ======
# k8s/services/*.yaml 中 readinessProbe / livenessProbe 指向
# /actuator/health/readiness 与 /actuator/health/liveness，
# 需显式开启 probes（非 k8s 环境不会自动启用）。
# exposure 仅暴露 health/info，show-details=never 避免泄露数据源等内部细节。
management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
