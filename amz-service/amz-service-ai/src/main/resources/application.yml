server:
  port: 8091
spring:
  application:
    name: amz-service-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:123.206.101.247:8848}
    sentinel:
      transport:
        dashboard: localhost:8858
      eager: true
      datasource:
        ds1:
          nacos:
            server-addr: ${NACOS_ADDR:123.206.101.247:8848}
            dataId: ${spring.application.name}-sentinel-rules
            groupId: SENTINEL_GROUP
            ruleType: flow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:121.37.250.15}:${MYSQL_PORT:3306}/amz_ai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:121.37.250.15}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
deepseek:
  api_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY:}
# Agent 配置
agent:
  # 主动提醒触发阈值
  reminder:
    inventory-days-threshold: 7        # 库存可售天数 < 7 触发提醒
    sales-drop-ratio-threshold: 0.20   # 销量环比下降 > 20% 触发提醒
  # 每日报告推送时间
  daily-report-cron: "0 0 8 * * ?"

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}
---
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 10000
  sentinel:
    enabled: true
