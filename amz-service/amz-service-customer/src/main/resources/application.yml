server:
  port: 8099
spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: amz-service-customer
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # ====== Flyway 基线（P0-58）======
  # 表结构的唯一事实源是 classpath:db/migration；Compose 与 k8s 只负责建空库。
  # baseline-on-migrate=false（P0-58 / 2026-09-30 修正）：非空库且无 flyway_schema_history 时，
  # Flyway 会在执行任何 DDL 之前就拒绝启动（fail-fast，报错指明用 baseline() 纳管），
  # 而不是像 true 那样先在 v1 打基线、再重放 V2..Vn 撞 Duplicate key，留下半迁移状态
  # （MySQL DDL 非事务，ad/order/spapi 2026-09-28 实测必炸）。空库路径照常执行 V1..Vn。
  # 纳管存量库请显式 baseline：tools/synthetic-data/apply_migrations.py 已代写基线行。
  flyway:
    baseline-on-migrate: false
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/amz_customer?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # ====== SMTP 邮件发送通道 ======
  # 用于 amz_email_task 的待发队列（processPendingEmails）。
  # host 为空 = 通道未配置：任务会被标 FAILED 并写明原因，绝不伪造 SENT。
  # password 走 SPRING_MAIL_PASSWORD（K8s 里取 secret），不在仓库留可用的默认值。
  # 注意：Amazon 政策禁止用邮件邀评/索评；索评能力（sendReviewSolicitations）仍保持
  # 「未接入」，不要因为有了 SMTP 就把它改成走邮件。
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        # 这两个键不是 Spring Boot 的自动装配属性，是本项目 SmtpEmailSender 读取的发件人。
        # 放在 spring.mail.properties 下是为了与 SMTP 其他参数聚在一起，便于运维一次配完。
        from: ${SPRING_MAIL_FROM:}
        from-name: ${SPRING_MAIL_FROM_NAME:}
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          # 587 端口通常要求 STARTTLS；465 端口则应改为 false 并启用 ssl.enable
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SPRING_MAIL_TIMEOUT_MS:30000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT_MS:30000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
# AI 分类服务（复用 amz-service-ai 的 LLM 能力）
ai:
  service:
    base-url: http://amz-service-ai

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%traceId] %-5level %logger{36} - %msg%n%wEx"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

# ====== Actuator / observability contract (P2-1) ======
# Boot 3 default web exposure is health only; /actuator/prometheus would 404.
# probes.enabled must be explicit for non-k8s (compose/local) environments.
# show-details=never prevents leaking datasource details via /actuator/health.
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
