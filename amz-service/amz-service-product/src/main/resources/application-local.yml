spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/amz_product?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  rabbitmq:
    host: localhost
    port: 5672
    username: ${MQ_USERNAME:admin}
    password: ${MQ_PASSWORD:admin}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
    mongodb:
      host: localhost
      port: 27017
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:123456}
