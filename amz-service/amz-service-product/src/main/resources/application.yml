server:
  port: 8095
spring:
  application:
    name: amz-service-product
  # 默认启用 mock 模式（离线开发）。生产环境通过 SPRING_PROFILES_ACTIVE 环境变量切换为非 mock
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:123.206.101.247:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:121.37.250.15}:${MYSQL_PORT:3306}/amz_product?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:123.206.101.247}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:121.37.250.15}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mongodb:
      host: ${MONGO_HOST:123.206.101.247}
      port: 27017
      database: amz
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:}
      authentication-database: admin
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

# Shopping Agent 配置
agent:
  # AI 服务 agent/chat 接口地址（通过网关访问）
  ai-chat-url: ${AGENT_AI_CHAT_URL:http://localhost:10010/ai/agent/chat}

# DeepSeek 翻译 API 配置
deepseek:
  api_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY:}


# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}
---
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 10000
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
