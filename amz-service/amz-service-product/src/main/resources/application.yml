server:
  port: 8095
spring:
  application:
    name: amz-service-product
  # 默认 prod（fail-closed）：未显式设置时启用真实客户端，缺凭证会显式失败，
  # 而不是静默返回样例数据（P0-57）。离线开发请显式设置 SPRING_PROFILES_ACTIVE=mock。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # ====== Flyway 基线（P0-58）======
  # 表结构的唯一事实源是 classpath:db/migration；Compose 与 k8s 只负责建空库。
  # baseline-on-migrate=true 是必需的：Flyway 10 默认为 false，非空库且无 flyway_schema_history 时
  # 会直接抛错并让应用拒绝启动（历史环境 14 个服务会同时起不来）。空库仍照常执行 V1。
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/amz_product?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: 27017
      database: amz
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:}
      authentication-database: admin
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

# Shopping Agent 配置
agent:
  # AI 服务 agent/chat 接口地址（通过网关访问）
  ai-chat-url: ${AGENT_AI_CHAT_URL:http://localhost:10010/ai/agent/chat}

# DeepSeek 翻译 API 配置
deepseek:
  api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
  api-key: ${DEEPSEEK_API_KEY:}
  model-name: ${DEEPSEEK_MODEL_NAME:deepseek-chat}
  temperature: ${DEEPSEEK_TEMPERATURE:0.7}
  timeout: ${DEEPSEEK_TIMEOUT_SECONDS:60}

# Listing Feed 状态轮询：提交后登记数据库计划，调度线程每次只查询一次，支持重启恢复。
listing-copy:
  poll:
    enabled: ${LISTING_COPY_POLL_ENABLED:true}
    scheduler-delay-ms: ${LISTING_COPY_POLL_SCHEDULER_DELAY_MS:15000}
    initial-delay-seconds: ${LISTING_COPY_POLL_INITIAL_DELAY_SECONDS:15}
    interval-seconds: ${LISTING_COPY_POLL_INTERVAL_SECONDS:15}
    max-duration-seconds: ${LISTING_COPY_POLL_MAX_DURATION_SECONDS:300}
    batch-size: ${LISTING_COPY_POLL_BATCH_SIZE:20}

# Keepa 竞品数据 API
keepa:
  api-key: ${KEEPA_API_KEY:}


# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
---
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 10000
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
---
# ====== Actuator 健康探针 ======
# k8s/services/*.yaml 中 readinessProbe / livenessProbe 指向
# /actuator/health/readiness 与 /actuator/health/liveness，
# 需显式开启 probes（非 k8s 环境不会自动启用）。
# exposure 仅暴露 health/info，show-details=never 避免泄露数据源等内部细节。
management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

# 共享汇率服务（amz-common GlobalExchangeRateService）离线兜底汇率。
# ListingCopyService 跨站点搬家时用于价格换算；缺省会退化为 1:1 导致定价失真，故必须配置。
amz:
  exchange-rates:
    USD: 7.25
    EUR: 7.85
    GBP: 9.20
    JPY: 0.046
  # 出站 HTTP 弹性策略（超时 / 重试 / 熔断），未配置时使用组件内置默认值
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    max-attempts: 3
    circuit:
      failure-threshold: 5
      open-duration-ms: 30000
