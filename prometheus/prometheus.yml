global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'rules/*.yml'

scrape_configs:
  - job_name: 'amz-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['amz-gateway:10010']
  - job_name: 'amz-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'amz-service-user:8080'
        - 'amz-service-product:8095'
        - 'amz-service-order:8105'
        - 'amz-service-search:8090'
        - 'amz-service-ai:8091'
        - 'amz-service-spapi:8096'
        - 'amz-service-ad:8097'
        - 'amz-service-procurement:8098'
        - 'amz-service-customer:8099'
        - 'amz-service-logistics:8100'
        - 'amz-service-ops:8101'
        - 'amz-service-report:8102'
        - 'amz-service-finance:8103'
        - 'amz-service-multiplatform:8104'
        - 'amz-service-message:8889'
  # 下面两个 job 支撑 amz-alerts.yml 里的 rabbitmq 积压与磁盘水位告警：
  # 没有抓取目标时那两条规则永远不触发（告警形同虚设）。
  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['amz-rabbitmq:15692']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['amz-node-exporter:9100']
