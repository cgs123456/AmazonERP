      - mysql
      - redis
    restart: unless-stopped

  # Logistics Service (FBA/FBM, overseas warehouses, port 8100)
  amz-service-logistics:
    image: amazon-erp/amz-service-logistics:latest
    container_name: amz-service-logistics
    ports:
      - "8100:8100"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Operations Service (flash sales, coupons, promotions, port 8101)
  amz-service-ops:
    image: amazon-erp/amz-service-ops:latest
    container_name: amz-service-ops
    ports:
      - "8101:8101"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Reporting Service (sales/profit/inventory reports, port 8102)
  amz-service-report:
    image: amazon-erp/amz-service-report:latest
    container_name: amz-service-report
    ports:
      - "8102:8102"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Finance Service (profit accounting, expenses, settlements, port 8103)
  amz-service-finance:
    image: amazon-erp/amz-service-finance:latest
    container_name: amz-service-finance
    ports:
      - "8103:8103"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Multi-platform Service (eBay/Shopify/Walmart integrations, port 8104)
  amz-service-multiplatform:
    image: amazon-erp/amz-service-multiplatform:latest
    container_name: amz-service-multiplatform
    ports:
      - "8104:8104"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Message Service (WebSocket + RabbitMQ real-time push, HTTP port 8889, Netty WS port 8888)
  amz-service-message:
    image: amazon-erp/amz-service-message:latest
    container_name: amz-service-message
    ports:
      - "8889:8889"
      # Netty WebSocket 端口：网关 /ws/** 路由转发到该端口（见 gateway application.yml）
      - "8888:8888"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq
    restart: unless-stopped

  # Frontend (Vue 3 + Vite, served by nginx, host:5173 -> container:80)
  # Before starting, run `npm run build` in amz-frontend to generate the dist directory
  amz-frontend:
    image: nginx:1.27-alpine
    container_name: amz-frontend
    ports:
      - "5173:80"
    volumes:
      - ./amz-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - amz-gateway
    restart: unless-stopped

volumes:
  mysql-data:
  mysql-slave-data:
  redis-data:
  mongo-data:
  es-data:
  alertmanager-data:
  prometheus-data:
  grafana-data:
  logstash-data:
