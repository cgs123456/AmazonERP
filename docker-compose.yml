# WARNING: All credentials MUST be provided via .env file or environment variables.
# No default passwords are set. The compose file will fail without proper credentials.

services:
  # ==================== 基础设施 ====================

  # Nacos - Service Discovery & Config Center
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: amz-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
      - PREFER_HOST_MODE=hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # MySQL Database (master, write node)
  # binlog + GTID enabled for replica sync. Create replication user manually:
  #   CREATE USER 'repl'@'%' IDENTIFIED BY '<pwd>';
  #   GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'repl'@'%';
  mysql:
    image: mysql:8.0
    container_name: amz-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:}
      - TZ=Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init-sql:/docker-entrypoint-initdb.d
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # MySQL Read Replica (slave, read node)
  # After startup, manually establish replication:
  #   CHANGE MASTER TO MASTER_HOST='mysql', MASTER_USER='repl',
  #     MASTER_PASSWORD='<pwd>', MASTER_AUTO_POSITION=1;
  #   START REPLICA;
  mysql-slave:
    image: mysql:8.0
    container_name: amz-mysql-slave
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:}
      - TZ=Asia/Shanghai
    ports:
      - "3317:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --relay-log=relay-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
      --super-read-only=ON
    depends_on:
      - mysql
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7.2
    container_name: amz-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
    restart: unless-stopped

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: amz-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${MQ_USERNAME:-admin}
      - RABBITMQ_DEFAULT_PASS=${MQ_PASSWORD:}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: amz-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: amz-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Logstash（日志收集与转发）
  logstash:
    image: logstash:8.15.3
    container_name: logstash
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - logstash-data:/usr/share/logstash/data
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Kibana（Elasticsearch 可视化）
  kibana:
    image: kibana:8.15.3
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ==================== Prometheus + Grafana 监控栈 ====================

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/data
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/data'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    restart: unless-stopped

  # ==================== Skywalking 分布式链路追踪 ====================

  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: skywalking-oap
    ports:
      - "11800:11800"   # gRPC agent port
      - "12800:12800"   # HTTP query port
    environment:
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200
      - SW_HEALTH_CHECKER=default
      - JAVA_OPTS=-Xms512m -Xmx512m
    depends_on:
      - elasticsearch
    restart: unless-stopped

  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: skywalking-ui
    ports:
      - "8081:8080"
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
    depends_on:
      - skywalking-oap
    restart: unless-stopped

  # ==================== 业务服务 ====================

  # API Gateway (Spring Cloud Gateway, unified entry point, port 10010)
  amz-gateway:
    image: amazon-erp/amz-gateway:latest
    container_name: amz-gateway
    ports:
      - "10010:10010"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      # 通过 compose 网络内服务名访问基础设施
      - NACOS_SERVER_ADDR=nacos:8848
      # WebSocket 上游：/ws/** 路由转发到 message 服务 Netty 端口（显式声明，避免依赖 yml 默认值）
      - WS_MESSAGE_UPSTREAM=http://amz-service-message:8888
    depends_on:
      - nacos
      - redis
    restart: unless-stopped

  # SP-API Integration Service (order sync, FBA inventory, replenishment engine, port 8096)
  amz-service-spapi:
    build: .
    image: amazon-erp/amz-service-spapi:latest
    container_name: amz-service-spapi
    ports:
      - "8096:8096"
    environment:
      # JWT signing key (required, auth will fail without it)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      # AES-256-GCM encryption key (32-byte base64), used to encrypt SP-API credentials
      - AMZ_CRYPTO_KEY=${AMZ_CRYPTO_KEY:-}
      # AWS SP-API 凭证
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # 基础设施连接
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
      # 读写分离：主库写、从库读
      - MYSQL_HOST=mysql
      - MYSQL_SLAVE_HOST=mysql-slave
      - MYSQL_PORT=3306
    depends_on:
      - nacos
      - mysql
      - mysql-slave
      - redis
      - rabbitmq
    restart: unless-stopped

  # User Management Service (users, roles, permissions, port 8080 — 与 application.yml/k8s 一致)
  amz-service-user:
    image: amazon-erp/amz-service-user:latest
    container_name: amz-service-user
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Product Management Service (products, categories, brands, SPU/SKU, port 8095 — 与 application.yml/k8s 一致)
  amz-service-product:
    image: amazon-erp/amz-service-product:latest
    container_name: amz-service-product
    ports:
      - "8095:8095"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
      - mongodb
    restart: unless-stopped

  # Order Management Service (orders, returns, reviews, port 8105)
  amz-service-order:
    image: amazon-erp/amz-service-order:latest
    container_name: amz-service-order
    ports:
      - "8105:8105"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Search Service (Elasticsearch product search, port 8090)
  amz-service-search:
    image: amazon-erp/amz-service-search:latest
    container_name: amz-service-search
    ports:
      - "8090:8090"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
      - elasticsearch
    restart: unless-stopped

  # AI Intelligence Service (smart recommendations, copy generation, port 8091)
  amz-service-ai:
    image: amazon-erp/amz-service-ai:latest
    container_name: amz-service-ai
    ports:
      - "8091:8091"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Ad Management Service (SP/SB/SD ad campaigns & analytics, port 8097)
  amz-service-ad:
    image: amazon-erp/amz-service-ad:latest
    container_name: amz-service-ad
    ports:
      - "8097:8097"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Procurement Service (purchase orders, suppliers, 1688 integration, port 8098)
  amz-service-procurement:
    image: amazon-erp/amz-service-procurement:latest
    container_name: amz-service-procurement
    ports:
      - "8098:8098"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Customer Management Service (customer profiles, segmentation, follow-ups, port 8099)
  amz-service-customer:
    image: amazon-erp/amz-service-customer:latest
    container_name: amz-service-customer
    ports:
      - "8099:8099"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:}
      - REDIS_PASSWORD=${REDIS_PASSWORD:}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:}
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
