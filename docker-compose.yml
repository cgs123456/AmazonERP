# WARNING: All credentials MUST be provided via .env file or environment variables.
# No default passwords are set. The compose file will fail without proper credentials.

services:
  # ==================== 基础设施 ====================

  # Nacos - Service Discovery & Config Center
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: amz-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
      - PREFER_HOST_MODE=hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # MySQL Database (master, write node)
  # binlog + GTID enabled for replica sync. Create replication user manually:
  #   CREATE USER 'repl'@'%' IDENTIFIED BY '<pwd>';
  #   GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'repl'@'%';
  mysql:
    image: mysql:8.0
    container_name: amz-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?DB_PASSWORD_required}
      - TZ=Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init-sql/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # MySQL Read Replica (slave, read node)
  # After startup, manually establish replication:
  #   CHANGE MASTER TO MASTER_HOST='mysql', MASTER_USER='repl',
  #     MASTER_PASSWORD='<pwd>', MASTER_AUTO_POSITION=1;
  #   START REPLICA;
  mysql-slave:
    image: mysql:8.0
    container_name: amz-mysql-slave
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?DB_PASSWORD_required}
      - TZ=Asia/Shanghai
    ports:
      - "3317:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --relay-log=relay-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
      --super-read-only=ON
    depends_on:
      - mysql
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7.2
    container_name: amz-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD_required} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD_required}
    restart: unless-stopped

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: amz-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD_required}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: amz-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?MONGO_PASSWORD_required}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: amz-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Logstash（日志收集与转发）
  logstash:
    image: logstash:8.15.3
    container_name: logstash
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - logstash-data:/usr/share/logstash/data
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Kibana（Elasticsearch 可视化）
  kibana:
    image: kibana:8.15.3
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ==================== Prometheus + Grafana 监控栈 ====================

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/data
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/data'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD_required}
    restart: unless-stopped

  # ==================== Skywalking 分布式链路追踪 ====================

  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: skywalking-oap
    ports:
      - "11800:11800"   # gRPC agent port
      - "12800:12800"   # HTTP query port
    environment:
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200
      - SW_HEALTH_CHECKER=default
      - JAVA_OPTS=-Xms512m -Xmx512m
    depends_on:
      - elasticsearch
    restart: unless-stopped

  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: skywalking-ui
    ports:
      - "8081:8080"
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
    depends_on:
      - skywalking-oap
    restart: unless-stopped

  # ==================== 业务服务 ====================

  # API Gateway (Spring Cloud Gateway, unified entry point, port 10010)
  amz-gateway:
    image: amazon-erp/amz-gateway:latest
    container_name: amz-gateway
    ports:
      - "10010:10010"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SW_AGENT_NAME=amz-gateway
      # CRYPTO_KEY 经 Spring 宽松绑定直接落到 crypto.key。AMZ_CRYPTO_KEY 只有 spapi/user 的 application.yml 显式映射过，
      # 其它服务只认 CRYPTO_KEY 这个名字；缺它 CryptoUtil 启动即拒（实测 gateway exit 1：crypto.key 未配置，拒绝启动）。
      - CRYPTO_KEY=${AMZ_CRYPTO_KEY:?AMZ_CRYPTO_KEY_required}
      # 通过 compose 网络内服务名访问基础设施
      - NACOS_ADDR=nacos:8848
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD:-sentinel-dashboard:8858}
      # WebSocket 上游：/ws/** 路由转发到 message 服务 Netty 端口（显式声明，避免依赖 yml 默认值）
      - WS_MESSAGE_UPSTREAM=http://amz-service-message:8888
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_required}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=${JAVA_OPTS:-}
      - GATEWAY_DOCS_ENABLED=${GATEWAY_DOCS_ENABLED:-false}
    depends_on:
      - nacos
      - redis
    restart: unless-stopped

  # SP-API Integration Service (order sync, FBA inventory, replenishment engine, port 8096)
  amz-service-spapi:
    build: .
    image: amazon-erp/amz-service-spapi:latest
    container_name: amz-service-spapi
    ports:
      - "8096:8096"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SW_AGENT_NAME=amz-service-spapi
      # CRYPTO_KEY 经 Spring 宽松绑定直接落到 crypto.key。AMZ_CRYPTO_KEY 只有 spapi/user 的 application.yml 显式映射过，
      # 其它服务只认 CRYPTO_KEY 这个名字；缺它 CryptoUtil 启动即拒（实测 gateway exit 1：crypto.key 未配置，拒绝启动）。
      - CRYPTO_KEY=${AMZ_CRYPTO_KEY:?AMZ_CRYPTO_KEY_required}
      - NACOS_ADDR=nacos:8848
      # 读写分离：主库写、从库读
      - MYSQL_HOST=mysql
      - MYSQL_SLAVE_HOST=mysql-slave
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - SPAPI_BASE_URL_OVERRIDE=${SPAPI_BASE_URL_OVERRIDE:-}
      - SPAPI_LWA_ENDPOINT_OVERRIDE=${SPAPI_LWA_ENDPOINT_OVERRIDE:-}
      - SPAPI_ALLOWLIST=${SPAPI_ALLOWLIST:-}
      - SPAPI_APP_NAME=${SPAPI_APP_NAME:-AmazonERP}
      - SPAPI_APP_VERSION=${SPAPI_APP_VERSION:-1.0-SNAPSHOT}
      - SPAPI_LANGUAGE=${SPAPI_LANGUAGE:-}
      - SPAPI_PLATFORM=${SPAPI_PLATFORM:-}
      - SPAPI_USER_AGENT=${SPAPI_USER_AGENT:-}
      - SPAPI_REQUIRE_CREDENTIALS=${SPAPI_REQUIRE_CREDENTIALS:-true}
      - SPAPI_CREDENTIAL_STORE_FAIL_ON_DB_ERROR=${SPAPI_CREDENTIAL_STORE_FAIL_ON_DB_ERROR:-true}
      - SPAPI_CREDENTIAL_CACHE_MAX_ENTRIES=${SPAPI_CREDENTIAL_CACHE_MAX_ENTRIES:-1000}
      - SPAPI_CREDENTIAL_CACHE_TTL_SECONDS=${SPAPI_CREDENTIAL_CACHE_TTL_SECONDS:-600}
      - SPAPI_ACTIVE_SHOP_IDS_TTL_SECONDS=${SPAPI_ACTIVE_SHOP_IDS_TTL_SECONDS:-60}
      - SPAPI_RESTRICTED_DATA_ENABLED=${SPAPI_RESTRICTED_DATA_ENABLED:-false}
      - SPAPI_RESTRICTED_DATA_REFRESH_SKEW_SECONDS=${SPAPI_RESTRICTED_DATA_REFRESH_SKEW_SECONDS:-60}
      - SPAPI_RESTRICTED_DATA_MAX_CACHE_ENTRIES=${SPAPI_RESTRICTED_DATA_MAX_CACHE_ENTRIES:-1000}
      - SPAPI_ORDER_PII_SYNC_ENABLED=${SPAPI_ORDER_PII_SYNC_ENABLED:-false}
      - SPAPI_OUTBOX_SCHEDULER_ENABLED=${SPAPI_OUTBOX_SCHEDULER_ENABLED:-true}
      - SPAPI_OUTBOX_SCHEDULER_DELAY_MS=${SPAPI_OUTBOX_SCHEDULER_DELAY_MS:-60000}
      - SPAPI_OUTBOX_BATCH_SIZE=${SPAPI_OUTBOX_BATCH_SIZE:-50}
      - SPAPI_OUTBOX_MAX_ATTEMPTS=${SPAPI_OUTBOX_MAX_ATTEMPTS:-4}
      - SPAPI_OUTBOX_BASE_DELAY_SECONDS=${SPAPI_OUTBOX_BASE_DELAY_SECONDS:-60}
      - SPAPI_OUTBOX_REPLAY_CLAIM_TIMEOUT_SECONDS=${SPAPI_OUTBOX_REPLAY_CLAIM_TIMEOUT_SECONDS:-900}
      # SP-API 通知入站：默认关闭且走 mock；接真实 SQS 需 source=sqs + queue-url/region
      - SPAPI_NOTIFICATIONS_ENABLED=${SPAPI_NOTIFICATIONS_ENABLED:-false}
      - SPAPI_NOTIFICATIONS_SOURCE=${SPAPI_NOTIFICATIONS_SOURCE:-mock}
      - SPAPI_NOTIFICATIONS_QUEUE_URL=${SPAPI_NOTIFICATIONS_QUEUE_URL:-}
      - SPAPI_NOTIFICATIONS_REGION=${SPAPI_NOTIFICATIONS_REGION:-}
      - SPAPI_NOTIFICATIONS_STS_ROLE_ARN=${SPAPI_NOTIFICATIONS_STS_ROLE_ARN:-}
      - SPAPI_NOTIFICATIONS_WAIT_TIME_SECONDS=${SPAPI_NOTIFICATIONS_WAIT_TIME_SECONDS:-20}
      - SPAPI_NOTIFICATIONS_MAX_MESSAGES=${SPAPI_NOTIFICATIONS_MAX_MESSAGES:-10}
      - SPAPI_NOTIFICATIONS_VISIBILITY_TIMEOUT_SECONDS=${SPAPI_NOTIFICATIONS_VISIBILITY_TIMEOUT_SECONDS:-60}
      - SPAPI_NOTIFICATIONS_BATCH_SIZE=${SPAPI_NOTIFICATIONS_BATCH_SIZE:-10}
      - SPAPI_NOTIFICATIONS_MAX_ATTEMPTS=${SPAPI_NOTIFICATIONS_MAX_ATTEMPTS:-5}
      - SPAPI_NOTIFICATIONS_BASE_DELAY_SECONDS=${SPAPI_NOTIFICATIONS_BASE_DELAY_SECONDS:-30}
      - SPAPI_NOTIFICATIONS_LEASE_TIMEOUT_SECONDS=${SPAPI_NOTIFICATIONS_LEASE_TIMEOUT_SECONDS:-300}
      - SPAPI_NOTIFICATIONS_PAYLOAD_MAX_BYTES=${SPAPI_NOTIFICATIONS_PAYLOAD_MAX_BYTES:-262144}
      - SPAPI_NOTIFICATIONS_SUBSCRIPTION_SYNC_ENABLED=${SPAPI_NOTIFICATIONS_SUBSCRIPTION_SYNC_ENABLED:-true}
      - SPAPI_NOTIFICATIONS_MOCK_SCENARIO=${SPAPI_NOTIFICATIONS_MOCK_SCENARIO:-order-change}
      # 基础设施连接
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD_required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD_required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD_required}
      # JWT signing key (required, auth will fail without it)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_required}
      # AES-256-GCM encryption key (32-byte base64), used to encrypt SP-API credentials
      - AMZ_CRYPTO_KEY=${AMZ_CRYPTO_KEY:?AMZ_CRYPTO_KEY_required}
      # AWS SP-API 凭证
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=${JAVA_OPTS:-}
    depends_on:
      - nacos
      - mysql
      - mysql-slave
      - redis
      - rabbitmq
    restart: unless-stopped

  # User Management Service (users, roles, permissions, port 8080 — 与 application.yml/k8s 一致)
  amz-service-user:
    image: amazon-erp/amz-service-user:latest
    container_name: amz-service-user
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SW_AGENT_NAME=amz-service-user
      # CRYPTO_KEY 经 Spring 宽松绑定直接落到 crypto.key。AMZ_CRYPTO_KEY 只有 spapi/user 的 application.yml 显式映射过，
      # 其它服务只认 CRYPTO_KEY 这个名字；缺它 CryptoUtil 启动即拒（实测 gateway exit 1：crypto.key 未配置，拒绝启动）。
      - CRYPTO_KEY=${AMZ_CRYPTO_KEY:?AMZ_CRYPTO_KEY_required}
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD_required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD_required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD_required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_required}
      - AMZ_CRYPTO_KEY=${AMZ_CRYPTO_KEY:?AMZ_CRYPTO_KEY_required}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=${JAVA_OPTS:-}
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Product Management Service (products, categories, brands, SPU/SKU, port 8095 — 与 application.yml/k8s 一致)
  amz-service-product:
    image: amazon-erp/amz-service-product:latest
    container_name: amz-service-product
    ports:
      - "8095:8095"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SW_AGENT_NAME=amz-service-product
      # CRYPTO_KEY 经 Spring 宽松绑定直接落到 crypto.key。AMZ_CRYPTO_KEY 只有 spapi/user 的 application.yml 显式映射过，
      # 其它服务只认 CRYPTO_KEY 这个名字；缺它 CryptoUtil 启动即拒（实测 gateway exit 1：crypto.key 未配置，拒绝启动）。
      - CRYPTO_KEY=${AMZ_CRYPTO_KEY:?AMZ_CRYPTO_KEY_required}
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - MONGO_HOST=mongodb
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - AGENT_AI_CHAT_URL=${AGENT_AI_CHAT_URL:-http://amz-gateway:10010/ai/agent/chat}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD_required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD_required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD_required}
      - MONGO_USERNAME=${MONGO_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_PASSWORD:?MONGO_PASSWORD_required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_required}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL_NAME=${DEEPSEEK_MODEL_NAME:-deepseek-chat}
      - DEEPSEEK_TEMPERATURE=${DEEPSEEK_TEMPERATURE:-0.7}
      - DEEPSEEK_TIMEOUT_SECONDS=${DEEPSEEK_TIMEOUT_SECONDS:-60}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=${JAVA_OPTS:-}
      - KEEPA_API_KEY=${KEEPA_API_KEY:-}
      - LISTING_COPY_POLL_ENABLED=${LISTING_COPY_POLL_ENABLED:-true}
      - LISTING_COPY_POLL_SCHEDULER_DELAY_MS=${LISTING_COPY_POLL_SCHEDULER_DELAY_MS:-15000}
      - LISTING_COPY_POLL_INITIAL_DELAY_SECONDS=${LISTING_COPY_POLL_INITIAL_DELAY_SECONDS:-15}
      - LISTING_COPY_POLL_INTERVAL_SECONDS=${LISTING_COPY_POLL_INTERVAL_SECONDS:-15}
      - LISTING_COPY_POLL_MAX_DURATION_SECONDS=${LISTING_COPY_POLL_MAX_DURATION_SECONDS:-300}
      - LISTING_COPY_POLL_BATCH_SIZE=${LISTING_COPY_POLL_BATCH_SIZE:-20}
    depends_on:
      - nacos
      - mysql
      - redis
      - mongodb
    restart: unless-stopped

  # Order Management Service (orders, returns, reviews, port 8105)
  amz-service-order:
    image: amazon-erp/amz-service-order:latest
    container_name: amz-service-order
    ports:
      - "8105:8105"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SW_AGENT_NAME=amz-service-order
      # CRYPTO_KEY 经 Spring 宽松绑定直接落到 crypto.key。AMZ_CRYPTO_KEY 只有 spapi/user 的 application.yml 显式映射过，
      # 其它服务只认 CRYPTO_KEY 这个名字；缺它 CryptoUtil 启动即拒（实测 gateway exit 1：crypto.key 未配置，拒绝启动）。
      - CRYPTO_KEY=${AMZ_CRYPTO_KEY:?AMZ_CRYPTO_KEY_required}
      - NACOS_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_SLAVE_HOST=mysql-slave
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # B1：凭证生成改发 MQ，同步链路强依赖 broker，容器内必须指向 rabbitmq 服务名
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - JWT_ISSUER=${JWT_ISSUER:-amz-erp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-amz-erp-client}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD_required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD_required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD_required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_required}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=${JAVA_OPTS:-}
    depends_on:
      - nacos
      - mysql
      - redis
    restart: unless-stopped

  # Search Service (Elasticsearch product search, port 8090)
  amz-service-search:
