filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    # 只收本 compose 项目的 amz-* 容器，别把宿主机上别的栈（zc-live-* 等）也拖进 Kibana
    include_lines: ['"container_name":"amz-']
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5044"]
