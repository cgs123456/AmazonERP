server:
  port: 10010
spring:
  application:
    name: amz-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        # 用户服务路由
        - id: amz-service-user
          uri: lb://amz-service-user
          predicates:
            - Path=/user/**
        # 商品服务路由
        - id: amz-service-product
          uri: lb://amz-service-product
          predicates:
            - Path=/product/**
        # 订单服务路由
        - id: amz-service-order
          uri: lb://amz-service-order
          predicates:
            - Path=/order/**
        # 搜索服务路由
        - id: amz-service-search
          uri: lb://amz-service-search
          predicates:
            - Path=/search/**
        # AI服务路由
        - id: amz-service-ai
          uri: lb://amz-service-ai
          predicates:
            - Path=/ai/**
        # SP-API服务路由
        - id: amz-service-spapi
          uri: lb://amz-service-spapi
          predicates:
            - Path=/spapi/**
        # SP-API 分层自检统一对外别名：/api/preflight/** -> /spapi/preflight/**
        # 自检会触发出网与 token 缓存失效，因此服务端契约为 POST；这里只做路径重写。
        - id: amz-service-spapi-preflight-api
          uri: lb://amz-service-spapi
          predicates:
            - Path=/api/preflight/**
          filters:
            - RewritePath=/api/preflight(?<segment>.*), /spapi/preflight${segment}
        # 连接器能力清单统一对外别名：/api/connectors/** -> /spapi/connectors/**
        - id: amz-service-spapi-connectors-api
          uri: lb://amz-service-spapi
          predicates:
            - Path=/api/connectors/**
          filters:
            - RewritePath=/api/connectors(?<segment>.*), /spapi/connectors${segment}
        # SP-API 凭证管理统一对外别名：/api/credentials/** -> /spapi/credentials/**
        # 凭证接口只接受 ADMIN 且校验店铺范围；密钥仅写入，不在状态接口回显。
        - id: amz-service-spapi-credentials-api
          uri: lb://amz-service-spapi
          predicates:
            - Path=/api/credentials/**
          filters:
            - RewritePath=/api/credentials(?<segment>.*), /spapi/credentials${segment}
        # 广告服务路由
        - id: amz-service-ad
          uri: lb://amz-service-ad
          predicates:
            - Path=/ad/**
        # 客户服务路由
        - id: amz-service-customer
          uri: lb://amz-service-customer
          predicates:
            - Path=/customer/**
        # 财务服务路由
        - id: amz-service-finance
          uri: lb://amz-service-finance
          predicates:
            - Path=/finance/**
        # 物流服务路由
        - id: amz-service-logistics
          uri: lb://amz-service-logistics
          predicates:
            - Path=/logistics/**
        # 多平台服务路由
        - id: amz-service-multiplatform
          uri: lb://amz-service-multiplatform
          predicates:
            - Path=/multiplatform/**
        # 运营服务路由
        - id: amz-service-ops
          uri: lb://amz-service-ops
          predicates:
            - Path=/ops/**
        # 采购服务路由
        - id: amz-service-procurement
          uri: lb://amz-service-procurement
          predicates:
            - Path=/procurement/**
        # 报表服务路由
        - id: amz-service-report
          uri: lb://amz-service-report
          predicates:
            - Path=/report/**
        # WebSocket服务路由
        # 注意：Netty WebSocket 监听独立端口 8888（非 HTTP 8889），
        # lb:// 负载均衡只会路由到 Nacos 注册的 HTTP 端口，故此处使用静态上游。
        # docker-compose 内通过容器名 amz-service-message 解析；其他环境用 WS_MESSAGE_UPSTREAM 覆盖。
        - id: amz-netty-websocket
          uri: ${WS_MESSAGE_UPSTREAM:http://amz-service-message:8888}
          predicates:
            - Path=/ws/**
          filters:
            # WebSocket路径映射：网关 /ws/socket -> 后端 /socket
            - RewritePath=/ws/(?<segment>.*), /${segment}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"ok":false,"code":429,"message":"请求过于频繁"}'

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Gateway exposure controls. API docs are closed by default; enable explicitly only
# for local development or a controlled private environment.
amz:
  gateway:
    docs:
      enabled: ${GATEWAY_DOCS_ENABLED:false}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
---
# ====== Actuator 健康探针 ======
# k8s/services/*.yaml 中 readinessProbe / livenessProbe 指向
# /actuator/health/readiness 与 /actuator/health/liveness，
# 需显式开启 probes（非 k8s 环境不会自动启用）。
# exposure 仅暴露 health/info，show-details=never 避免泄露数据源等内部细节。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    # 默认关闭：API 文档经网关对外暴露属信息泄露面；本地开发在
    # application-local.yml 中覆盖为 true
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  show-actuator: false
