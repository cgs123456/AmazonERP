server:
  port: 10010
spring:
  application:
    name: amz-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:123.206.101.247:8848}
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        # 用户服务路由
        - id: amz-service-user
          uri: lb://amz-service-user
          predicates:
            - Path=/user/**
        # 商品服务路由
        - id: amz-service-product
          uri: lb://amz-service-product
          predicates:
            - Path=/product/**
        # 订单服务路由
        - id: amz-service-order
          uri: lb://amz-service-order
          predicates:
            - Path=/order/**
        # 搜索服务路由
        - id: amz-service-search
          uri: lb://amz-service-search
          predicates:
            - Path=/search/**
        # AI服务路由
        - id: amz-service-ai
          uri: lb://amz-service-ai
          predicates:
            - Path=/ai/**
        # SP-API服务路由
        - id: amz-service-spapi
          uri: lb://amz-service-spapi
          predicates:
            - Path=/spapi/**
        # 广告服务路由
        - id: amz-service-ad
          uri: lb://amz-service-ad
          predicates:
            - Path=/ad/**
        # 客户服务路由
        - id: amz-service-customer
          uri: lb://amz-service-customer
          predicates:
            - Path=/customer/**
        # 财务服务路由
        - id: amz-service-finance
          uri: lb://amz-service-finance
          predicates:
            - Path=/finance/**
        # 物流服务路由
        - id: amz-service-logistics
          uri: lb://amz-service-logistics
          predicates:
            - Path=/logistics/**
        # 多平台服务路由
        - id: amz-service-multiplatform
          uri: lb://amz-service-multiplatform
          predicates:
            - Path=/multiplatform/**
        # 运营服务路由
        - id: amz-service-ops
          uri: lb://amz-service-ops
          predicates:
            - Path=/ops/**
        # 采购服务路由
        - id: amz-service-procurement
          uri: lb://amz-service-procurement
          predicates:
            - Path=/procurement/**
        # 报表服务路由
        - id: amz-service-report
          uri: lb://amz-service-report
          predicates:
            - Path=/report/**
        # WebSocket服务路由（使用Nacos服务发现）
        - id: amz-netty-websocket
          uri: lb://amz-service-message
          predicates:
            - Path=/ws/**
          filters:
            # WebSocket路径映射：网关 /ws/socket -> 后端 /socket
            - RewritePath=/ws/(?<segment>.*), /${segment}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"ok":false,"code":429,"message":"请求过于频繁"}'

# JWT security config
jwt:
  secret-key: ${JWT_SECRET_KEY:}
  issuer: ${JWT_ISSUER:amz-erp}
  audience: ${JWT_AUDIENCE:amz-erp-client}

# Logging — traceId 注入（与 Skywalking 链路追踪关联）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
---
# ====== Actuator 健康探针 ======
# k8s/services/*.yaml 中 readinessProbe / livenessProbe 指向
# /actuator/health/readiness 与 /actuator/health/liveness，
# 需显式开启 probes（非 k8s 环境不会自动启用）。
# exposure 仅暴露 health/info，show-details=never 避免泄露数据源等内部细节。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
